<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UA TETRIS 🗿</title>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <style>
    body { background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; margin: 0; padding: 10px; overflow-x: hidden; touch-action: none; }
    .header { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; width: 100%; justify-content: center; }
    .stat-box { text-align: center; background: #333; padding: 5px 8px; border-radius: 8px; border: 1px solid #444; min-width: 60px; transition: 0.3s; }
    .label { font-size: 9px; color: #aaa; text-transform: uppercase; }
    .value { font-size: 16px; font-weight: bold; color: #00d4ff; }
    .vip-border { border-color: #ffd700; box-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }
    
    #ton-connect-button { margin-bottom: 10px; }
    .pay-btn { background: #0088cc; color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; display: none; margin-bottom: 10px; width: 280px; }
    
    canvas { border: 2px solid #555; background: #000; width: 280px; height: 400px; border-radius: 10px; }
    
    .controls { display: grid; grid-template-columns: repeat(3, 80px); grid-gap: 15px; margin-top: 15px; }
    .btn { background: #333; border: 2px solid #555; color: white; padding: 20px; border-radius: 15px; font-size: 25px; text-align: center; user-select: none; -webkit-tap-highlight-color: transparent; }
    .btn:active { background: #555; }

    /* UI Таблиці лідерів */
    #leaderboard-ui { display:none; background: rgba(0,0,0,0.95); position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    #playerName { padding: 12px; border-radius: 8px; border: 1px solid #555; background: #222; color: white; margin: 15px 0; width: 200px; font-size: 16px; }
    .share-btn { background: #0088cc; color: white; padding: 12px 25px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    
    #reviveBtn { display: none; background: #e91e63; color: white; border: none; padding: 12px; border-radius: 10px; margin-top: 10px; font-weight: bold; width: 280px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
  </style>
</head>
<body>

  <div id="ton-connect-button"></div>
  <button id="payButton" class="pay-btn" onclick="sendPayment()">🔓 Відкрити VIP Level (0.01 TON)</button>

  <div class="header">
    <div class="stat-box">
      <div class="label">Score</div>
      <div id="score" class="value">0</div>
    </div>
    <div class="stat-box">
      <div class="label">Best</div>
      <div id="best" class="value">0</div>
    </div>
    <div id="levelBox" class="stat-box">
      <div class="label">Level</div>
      <div id="levelDisplay" class="value">1</div>
    </div>
    <button style="background:#444; border:none; color:white; border-radius:50%; width:35px; height:35px; cursor:pointer;" onclick="toggleMusic()">🔈</button>
  </div>

  <canvas id="tetris" width="240" height="400"></canvas>
  <button id="reviveBtn" onclick="revivePlayer()">♻️ Викупити життя (500 pts)</button>

  <div class="controls">
    <div></div>
    <div class="btn" style="background:#444" onpointerdown="playerRotate(1)">🔄</div>
    <div></div>
    <div class="btn" onpointerdown="playerMove(-1)">⬅️</div>
    <div class="btn" onpointerdown="playerDrop()">⬇️</div>
    <div class="btn" onpointerdown="playerMove(1)">➡️</div>
  </div>

  <div id="leaderboard-ui">
    <h2 style="color: #ffd700; margin: 0;">GAME OVER 🗿</h2>
    <p style="margin: 10px 0;">Ваш результат: <span id="finalScore" style="font-size: 28px; color: #00d4ff; font-weight: bold;">0</span></p>
    <input type="text" id="playerName" placeholder="Твій нік в Telegram">
    <button class="share-btn" onclick="shareResult()">🚀 Опублікувати в чат</button>
    <button onclick="closeLeaderboard()" style="margin-top: 20px; background: none; color: #aaa; border: none; text-decoration: underline; cursor: pointer;">Спробувати знову</button>
  </div>

  <audio id="bgMusic" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" type="audio/mpeg">
  </audio>

  <script>
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: 'https://providnykzpoun-bit.github.io/Tetris/tonconnect-manifest.json',
        buttonRootId: 'ton-connect-button'
    });

    let isLevelPaid = localStorage.getItem('ua_tetris_paid') === 'true';
    let dropInterval = isLevelPaid ? 450 : 1000;
    
    // Підвантаження імені
    document.getElementById('playerName').value = localStorage.getItem('ua_player_name') || "";

    function updateUI() {
        document.getElementById('levelDisplay').innerText = isLevelPaid ? "VIP" : "1";
        if(isLevelPaid) {
            document.getElementById('levelDisplay').style.color = "#ffd700";
            document.getElementById('levelBox').classList.add('vip-border');
        }
    }
    updateUI();

    tonConnectUI.onStatusChange(wallet => {
        document.getElementById('payButton').style.display = (wallet && !isLevelPaid) ? 'block' : 'none';
    });

    async function sendPayment() {
        const transaction = {
            validUntil: Math.floor(Date.now() / 1000) + 120,
            messages: [{ address: "UQDXq1iAqu88tVRG62_k03kAXELu_1gzRBMye-VZoFRIRtWw", amount: "10000000" }]
        };
        try {
            await tonConnectUI.sendTransaction(transaction);
            localStorage.setItem('ua_tetris_paid', 'true');
            isLevelPaid = true;
            dropInterval = 450;
            updateUI();
            document.getElementById('payButton').style.display = 'none';
            alert("VIP активовано! Швидкість х2, Очки х5!");
        } catch (e) { alert("Оплата не пройшла"); }
    }

    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    context.scale(20, 20);

    function arenaSweep() {
        let rowCount = 1;
        outer: for (let y = arena.length - 1; y > 0; --y) {
            for (let x = 0; x < arena[y].length; ++x) {
                if (arena[y][x] === 0) continue outer;
            }
            const row = arena.splice(y, 1)[0].fill(0);
            arena.unshift(row);
            ++y;
            player.score += rowCount * (isLevelPaid ? 50 : 10);
            rowCount *= 2;
        }
    }

    function revivePlayer() {
        if (player.score >= 500) {
            player.score -= 500;
            arena.forEach((row, y) => { if(y < 12) row.fill(0) });
            document.getElementById('reviveBtn').style.display = 'none';
            updateScore();
            update();
        }
    }

    function playerReset() {
        const pieces = 'ILJOTSZ';
        player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
        player.pos.y = 0;
        player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
        
        if (collide(arena, player)) {
            if (player.score >= 500) {
                document.getElementById('reviveBtn').style.display = 'block';
                cancelAnimationFrame(gameId);
            } else {
                finishGame();
            }
        }
    }

    function finishGame() {
        const finalScore = player.score;
        const best = localStorage.getItem('ua_tetris_best') || 0;
        if (finalScore > best) localStorage.setItem('ua_tetris_best', finalScore);
        
        document.getElementById('finalScore').innerText = finalScore;
        document.getElementById('leaderboard-ui').style.display = 'flex';
        cancelAnimationFrame(gameId);
    }

    function shareResult() {
        const name = document.getElementById('playerName').value || "Анонім";
        localStorage.setItem('ua_player_name', name);
        const score = player.score;
        const status = isLevelPaid ? "VIP 👑" : "Normal";
        
        const message = `🗿 Мій рекорд у UA TETRIS!\n\n👤 Нік: ${name}\n🏆 Очки: ${score}\n💎 Статус: ${status}\n\n@uatokenkrypta — грай та вигравай! 🚀`;
        const telegramUrl = `https://t.me/share/url?url=https://t.me/uatokenkrypta&text=${encodeURIComponent(message)}`;
        window.open(telegramUrl, '_blank');
    }

    function closeLeaderboard() {
        document.getElementById('leaderboard-ui').style.display = 'none';
        arena.forEach(row => row.fill(0));
        player.score = 0;
        updateScore();
        playerReset();
        update();
    }

    const colors = [null, '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'];
    function createMatrix(w, h) { const m = []; while (h--) m.push(new Array(w).fill(0)); return m; }
    function createPiece(t) {
        if(t==='T')return[[0,1,0],[1,1,1],[0,0,0]]; if(t==='O')return[[2,2],[2,2]];
        if(t==='L')return[[0,3,0],[0,3,0],[0,3,3]]; if(t==='J')return[[0,4,0],[0,4,0],[4,4,0]];
        if(t==='I')return[[0,5,0,0],[0,5,0,0],[0,5,0,0],[0,5,0,0]];
        if(t==='S')return[[0,6,6],[6,6,0],[0,0,0]]; if(t==='Z')return[[7,7,0],[0,7,7],[0,0,0]];
    }
    function draw() { context.fillStyle='#000'; context.fillRect(0,0,canvas.width,canvas.height); drawMatrix(arena,{x:0,y:0}); drawMatrix(player.matrix,player.pos); }
    function drawMatrix(m,o) { m.forEach((r,y)=>{ r.forEach((v,x)=>{ if(v!==0){ context.fillStyle=colors[v]; context.fillRect(x+o.x,y+o.y,1,1); }});});}
    function collide(a,p) { const [m,o]=[p.matrix,p.pos]; for(let y=0;y<m.length;++y){for(let x=0;x<m[y].length;++x){if(m[y][x]!==0&&(a[y+o.y]&&a[y+o.y][x+o.x])!==0)return true;}} return false; }
    function merge(a,p) { p.matrix.forEach((r,y)=>{r.forEach((v,x)=>{if(v!==0)a[y+p.pos.y][x+p.pos.x]=v;});});}
    function rotate(m,d) { for(let y=0;y<m.length;++y){for(let x=0;x<y;++x){[m[x][y],m[y][x]]=[m[y][x],m[x][y]];}} if(d>0)m.forEach(r=>r.reverse()); else m.reverse(); }
    function playerDrop() { player.pos.y++; if(collide(arena,player)){player.pos.y--; merge(arena,player); playerReset(); arenaSweep(); updateScore();} dropCounter=0; }
    function playerMove(d) { player.pos.x+=d; if(collide(arena,player))player.pos.x-=d; }
    function playerRotate(d) { const p=player.pos.x; let o=1; rotate(player.matrix,d); while(collide(arena,player)){player.pos.x+=o; o=-(o+(o>0?1:-1)); if(o>player.matrix[0].length){rotate(player.matrix,-d); player.pos.x=p; return;}}}
    function updateScore() { document.getElementById('score').innerText=player.score; const b=localStorage.getItem('ua_tetris_best')||0; document.getElementById('best').innerText=player.score>b?player.score:b; }
    let dropCounter=0, lastTime=0, gameId;
    function update(t=0){ const dt=t-lastTime; lastTime=t; dropCounter+=dt; if(dropCounter>dropInterval)playerDrop(); draw(); gameId=requestAnimationFrame(update); }
    const arena=createMatrix(12,20), player={pos:{x:0,y:0},matrix:null,score:0};
    const music=document.getElementById('bgMusic'); let isM=false;
    function toggleMusic(){ if(isM){music.pause(); document.querySelector('button[onclick="toggleMusic()"]').innerText='🔈';} else {music.play(); document.querySelector('button[onclick="toggleMusic()"]').innerText='🔊';} isM=!isM; }
    playerReset(); updateScore(); update();
  </script>
</body>
</html>
