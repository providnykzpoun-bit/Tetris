<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UA TETRIS 🗿</title>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    body { background: #111; color: white; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; margin: 0; padding: 5px; touch-action: none; overflow: hidden; height: 100vh; }
    #ton-connect-button { margin: 5px 0; transform: scale(0.9); }
    .menu-btn { width: 260px; padding: 10px; margin: 3px 0; border-radius: 8px; border: none; font-weight: bold; font-size: 14px; cursor: pointer; text-align: center; }
    #payButton { background: #0088cc; color: white; display: none; }
    .top-btn { background: #ffd700; color: #000; }
    .header { display: flex; gap: 10px; margin-bottom: 5px; }
    .stat-box { text-align: center; background: #222; padding: 5px 15px; border-radius: 8px; border: 1px solid #333; }
    .value { font-size: 18px; font-weight: bold; color: #00d4ff; }
    canvas { border: 2px solid #444; background: #000; width: 220px; height: 380px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    .controls { display: flex; justify-content: center; gap: 6px; margin-top: 15px; width: 100%; }
    .btn { background: #2a2a2a; border: 2px solid #444; color: white; width: 60px; height: 60px; border-radius: 15px; font-size: 24px; display: flex; align-items: center; justify-content: center; user-select: none; -webkit-tap-highlight-color: transparent; }
    .btn:active { background: #444; transform: scale(0.9); }
    .overlay { display:none; background: rgba(0,0,0,0.9); position: fixed; top:0; left:0; width:100%; height:100%; z-index:100; flex-direction: column; align-items: center; justify-content: center; }
    .content { background: #1a1a1a; padding: 20px; border-radius: 15px; width: 80%; text-align: center; border: 1px solid #ffd700; }
  </style>
</head>
<body onclick="initAudio()">

  <div id="ton-connect-button"></div>
  <button id="payButton" class="menu-btn" onclick="sendPayment()">🔓 Відкрити VIP Level (0.01 TON)</button>
  <button class="menu-btn top-btn" onclick="showLeaderboard()">🏆 ТОР ГРАВЦІВ</button>

  <div class="header">
    <div class="stat-box"><div>SCORE</div><div id="score" class="value">0</div></div>
    <div class="stat-box"><div>BEST</div><div id="best" class="value">0</div></div>
  </div>

  <canvas id="tetris" width="240" height="400"></canvas>

  <div class="controls">
    <div class="btn" onpointerdown="playerMove(-1)">⬅️</div>
    <div class="btn" onpointerdown="playerRotate()">🔄</div>
    <div class="btn" onpointerdown="playerDrop()">⬇️</div>
    <div class="btn" onpointerdown="playerMove(1)">➡️</div>
  </div>

  <div id="gameOverBox" class="overlay">
    <div class="content">
      <h2 style="color:#ffd700">GAME OVER</h2>
      <p>Очки: <span id="finalScore">0</span></p>
      <input type="text" id="pName" placeholder="Твій нік" style="padding:12px; width:85%; margin-bottom:15px; border-radius:8px; border:none; background:#333; color:white;">
      <button class="menu-btn top-btn" onclick="saveRecord()">💾 ЗБЕРЕГТИ</button>
      <button onclick="location.reload()" style="background:none; color:#777; border:none; margin-top:15px;">Спробувати ще</button>
    </div>
  </div>

  <div id="leaderBox" class="overlay">
    <div class="content">
      <h3 style="color:#ffd700">🏆 TOP PLAYERS</h3>
      <div id="leaderList" style="text-align:left; margin-bottom:15px; font-size:14px; max-height:200px; overflow-y:auto;"></div>
      <button class="menu-btn" style="background:#333; color:white;" onclick="document.getElementById('leaderBox').style.display='none'">Назад</button>
    </div>
  </div>

  <script>
    // --- ЗВУК ---
    let audioCtx = null;
    function initAudio() { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    function beep(f, type="square", d=0.1) {
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(f, audioCtx.currentTime);
        g.gain.setValueAtTime(0.1, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + d);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + d);
    }

    // --- SUPABASE & TON ---
    const supabaseUrl = 'https://etwbvrrbflvyxkvetsir.supabase.co';
    const supabaseKey = 'sb_publishable_qd7oP1_Db2k5GFGNNDruHQ_I6ww6f9E';
    const _supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: 'https://providnykzpoun-bit.github.io/Tetris/tonconnect-manifest.json',
        buttonRootId: 'ton-connect-button'
    });

    tonConnectUI.onStatusChange(wallet => {
        document.getElementById('payButton').style.display = wallet ? 'block' : 'none';
    });

    async function sendPayment() {
        const tx = { validUntil: Math.floor(Date.now()/1000)+60, messages: [{address:"UQDXq1iAqu88tVRG62_k03kAXELu_1gzRBMye-VZoFRIRtWw", amount:"10000000"}] };
        try { await tonConnectUI.sendTransaction(tx); dropInterval = 400; beep(800, "sine", 0.5); } catch(e) {}
    }

    async function saveRecord() {
        const wallet = tonConnectUI.wallet;
        const name = document.getElementById('pName').value || "UA_User";
        const score = parseInt(document.getElementById('finalScore').innerText);
        if(!wallet) return alert("Підключи гаманець!");
        const { error } = await _supabase.from('players').upsert([{ wallet: wallet.account.address, username: name, score: score }], { onConflict: 'wallet' });
        if(!error) { beep(600, "sine", 0.3); alert("Збережено!"); location.reload(); }
    }

    async function showLeaderboard() {
        document.getElementById('leaderBox').style.display='flex';
        const { data } = await _supabase.from('players').select('username, score').order('score', {ascending: false}).limit(10);
        document.getElementById('leaderList').innerHTML = data ? data.map((p, i) => `<div>${i+1}. ${p.username}: ${p.score}</div>`).join('') : "Завантаження...";
    }

    // --- ГРА ---
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    context.scale(20, 20);

    const colors = [null, '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'];
    const arena = Array.from({length: 20}, () => new Array(12).fill(0));
    const player = { pos: {x: 0, y: 0}, matrix: null, score: 0 };

    function createPiece(t) {
        if (t === 'T') return [[0, 1, 0], [1, 1, 1], [0, 0, 0]];
        if (t === 'O') return [[2, 2], [2, 2]];
        if (t === 'L') return [[0, 3, 0], [0, 3, 0], [0, 3, 3]];
        if (t === 'J') return [[0, 4, 0], [0, 4, 0], [4, 4, 0]];
        if (t === 'I') return [[0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0]];
        if (t === 'S') return [[0, 6, 6], [6, 6, 0], [0, 0, 0]];
        if (t === 'Z') return [[7, 7, 0], [0, 7, 7], [0, 0, 0]];
    }

    function draw() {
        context.fillStyle = '#000';
        context.fillRect(0, 0, canvas.width, canvas.height);
        drawMatrix(arena, {x: 0, y: 0});
        drawMatrix(player.matrix, player.pos);
    }

    function drawMatrix(m, o) {
        m.forEach((row, y) => row.forEach((v, x) => {
            if (v !== 0) { context.fillStyle = colors[v]; context.fillRect(x + o.x, y + o.y, 1, 1); }
        }));
    }

    function collide(a, p) {
        const [m, o] = [p.matrix, p.pos];
