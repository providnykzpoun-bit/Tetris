<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UA TETRIS 🗿</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { background: #111; color: white; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; margin: 0; padding: 10px; touch-action: none; overflow: hidden; height: 100vh; }
        
        /* КНОПКА ГАМАНЦЯ */
        #ton-connect-button { margin-bottom: 10px; min-height: 44px; z-index: 100; display: flex; justify-content: center; }
        
        .menu-btn { width: 260px; padding: 12px; margin: 5px 0; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-size: 14px; background: #ffd700; color: #000; }
        #payButton { background: #0088cc; color: white; display: none; }
        
        .stats-row { display: flex; gap: 10px; margin: 10px 0; }
        .stat-box { background: #222; padding: 8px 15px; border-radius: 8px; border: 1px solid #333; min-width: 90px; text-align: center; }
        .label { font-size: 10px; color: #aaa; text-transform: uppercase; }
        .value { font-size: 18px; font-weight: bold; color: #00d4ff; }

        canvas { border: 3px solid #444; background: #000; width: 240px; height: 400px; border-radius: 10px; }
        
        .controls { display: grid; grid-template-columns: repeat(3, 70px); gap: 10px; margin-top: 15px; }
        .btn { background: #333; border: 1px solid #555; color: white; width: 70px; height: 70px; border-radius: 15px; font-size: 24px; display: flex; align-items: center; justify-content: center; user-select: none; }
        
        .overlay { display:none; background: rgba(0,0,0,0.9); position: fixed; top:0; left:0; width:100%; height:100%; z-index:1000; flex-direction: column; align-items: center; justify-content: center; }
        .content { background: #1a1a1a; padding: 25px; border-radius: 20px; width: 80%; text-align: center; border: 2px solid #ffd700; }
    </style>
</head>
<body>

    <div id="ton-connect-button"></div>
    
    <button id="payButton" class="menu-btn" onclick="sendPayment()">🔓 VIP Level (0.01 TON)</button>
    <button class="menu-btn" onclick="showLeaderboard()">🏆 ТОР ГРАВЦІВ</button>

    <div class="stats-row">
        <div class="stat-box"><div class="label">Очки</div><div id="score" class="value">0</div></div>
        <div class="stat-box"><div class="label">Рекорд</div><div id="best" class="value">0</div></div>
    </div>

    <canvas id="tetris" width="240" height="400"></canvas>

    <div class="controls">
        <div class="btn" onpointerdown="playerMove(-1)">⬅️</div>
        <div class="btn" onpointerdown="playerRotate()">🔄</div>
        <div class="btn" onpointerdown="playerMove(1)">➡️</div>
        <div></div>
        <div class="btn" onpointerdown="playerDrop()">⬇️</div>
        <div></div>
    </div>

    <div id="gameOverBox" class="overlay">
        <div class="content">
            <h2 style="color:#ff4444">GAME OVER</h2>
            <p>Результат: <span id="finalScore">0</span></p>
            <input type="text" id="pName" placeholder="Твій нік" style="padding:10px; width:80%; margin-bottom:10px; border-radius:5px; border:none;">
            <button class="menu-btn" onclick="saveRecord()">ЗБЕРЕГТИ</button>
            <button onclick="location.reload()" style="background:none; color:white; border:none; margin-top:15px; cursor:pointer;">Заново</button>
        </div>
    </div>

    <script>
        // --- TON CONNECT ІНІЦІАЛІЗАЦІЯ ---
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://providnykzpoun-bit.github.io/Tetris/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        tonConnectUI.onStatusChange(wallet => {
            const payBtn = document.getElementById('payButton');
            if (wallet) { payBtn.style.display = 'block'; } 
            else { payBtn.style.display = 'none'; }
        });

        const _supabase = window.supabase.createClient('https://etwbvrrbflvyxkvetsir.supabase.co', 'sb_publishable_qd7oP1_Db2k5GFGNNDruHQ_I6ww6f9E');

        async function sendPayment() {
            const tx = {
                validUntil: Math.floor(Date.now() / 1000) + 60,
                messages: [{ address: "UQDXq1iAqu88tVRG62_k03kAXELu_1gzRBMye-VZoFRIRtWw", amount: "10000000" }]
            };
            try { await tonConnectUI.sendTransaction(tx); } catch(e) { console.error(e); }
        }

        // --- ЛОГІКА ТЕТРІСУ ---
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        context.scale(20, 20);

        function createPiece(type) {
            if (type === 'I') return [[0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0]];
            if (type === 'L') return [[0, 2, 0], [0, 2, 0], [0, 2, 2]];
            if (type === 'J') return [[0, 3, 0], [0, 3, 0], [3, 3, 0]];
            if (type === 'O') return [[4, 4], [4, 4]];
            if (type === 'Z') return [[5, 5, 0], [0, 5, 5], [0, 0, 0]];
            if (type === 'S') return [[0, 6, 6], [6, 6, 0], [0, 0, 0]];
            if (type === 'T') return [[0, 7, 0], [7, 7, 7], [0, 0, 0]];
        }

        const colors = [null, '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'];
        const arena = Array.from({length: 20}, () => new Array(12).fill(0));
        const player = { pos: {x: 0, y: 0}, matrix: null, score: 0 };

        function draw() {
            context.fillStyle = '#000';
            context.fillRect(0, 0, canvas.width, canvas.height);
            drawMatrix(arena, {x: 0, y: 0});
            drawMatrix(player.matrix, player.pos);
        }

        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.fillStyle = colors[value];
                        context.fillRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        function collide(arena, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) return true;
                }
            }
            return false;
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value;
                });
            });
        }

        function arenaSweep() {
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) continue outer;
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                player.score += 10;
            }
            document.getElementById('score').innerText = player.score;
        }

        window.playerDrop = function() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
            }
            dropCounter = 0;
        };

        window.playerMove = function(dir) {
            player.pos.x += dir;
            if (collide(arena, player)) player.pos.x -= dir;
        };

        window.playerRotate = function() {
            const pos = player.pos.x;
            let offset = 1;
            const matrix = player.matrix;
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            matrix.forEach(row => row.reverse());
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > matrix[0].length) {
                    player.pos.x = pos;
                    return;
                }
            }
        };

        function playerReset() {
            const pieces = 'ILJOTSZ';
            player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
            if (collide(arena, player)) {
                document.getElementById('finalScore').innerText = player.score;
                document.getElementById('gameOverBox').style.display = 'flex';
                player.score = 0; // Скидання для візуалу
            }
        }

        async function saveRecord() {
            const wallet = tonConnectUI.wallet;
            if(!wallet) return alert("Спочатку підключи гаманець!");
            const name = document.getElementById('pName').value || "Гравець";
            const finalScore = parseInt(document.getElementById('finalScore').innerText);
            await _supabase.from('players').upsert([{ wallet: wallet.account.address, username: name, score: finalScore }], { onConflict: 'wallet' });
            location.reload();
        }

        let dropCounter = 0;
        let lastTime = 0;
        function update(time = 0) {
            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;
            if (dropCounter > 1000) playerDrop();
            draw();
            requestAnimationFrame(update);
        }

        playerReset();
        update();
    </script>
</body>
</html>
