<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UA TETRIS 🗿</title>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <style>
    body { background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; margin: 0; padding: 10px; overflow-x: hidden; touch-action: none; }
    .header { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; width: 100%; justify-content: center; }
    .stat-box { text-align: center; background: #333; padding: 5px 8px; border-radius: 8px; border: 1px solid #444; min-width: 60px; }
    .label { font-size: 9px; color: #aaa; text-transform: uppercase; }
    .value { font-size: 16px; font-weight: bold; color: #00d4ff; }
    
    #ton-connect-button { margin-bottom: 10px; }
    .pay-btn { background: #0088cc; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; display: none; margin-bottom: 10px; width: 280px; }
    .top-btn { background: #ffd700; color: #000; border: none; padding: 10px; border-radius: 8px; font-weight: bold; margin-bottom: 10px; width: 280px; cursor: pointer; }
    
    canvas { border: 2px solid #555; background: #000; width: 240px; height: 400px; border-radius: 10px; }
    .controls { display: grid; grid-template-columns: repeat(3, 80px); grid-gap: 15px; margin-top: 15px; }
    .btn { background: #333; border: 2px solid #555; color: white; padding: 20px; border-radius: 15px; font-size: 25px; text-align: center; user-select: none; }

    #leaderboard-overlay { display:none; background: rgba(0,0,0,0.95); position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 200; flex-direction: column; align-items: center; justify-content: center; }
    #game-over-ui { display:none; background: rgba(0,0,0,0.95); position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 150; flex-direction: column; align-items: center; justify-content: center; }
    .list-container { background: #222; padding: 20px; border-radius: 15px; border: 1px solid #ffd700; width: 80%; max-height: 60%; overflow-y: auto; }
    .player-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #444; }
    input { padding: 12px; border-radius: 8px; border: 1px solid #555; background: #222; color: white; margin: 15px 0; width: 200px; }
  </style>
</head>
<body>

  <div id="ton-connect-button"></div>
  <button id="payButton" class="pay-btn" onclick="sendPayment()">🔓 Відкрити VIP Level (0.01 TON)</button>
  <button class="top-btn" onclick="showLeaderboard()">🏆 ТОП ГРАВЦІВ</button>

  <div class="header">
    <div class="stat-box"><div class="label">Score</div><div id="score" class="value">0</div></div>
    <div class="stat-box"><div class="label">Best</div><div id="best" class="value">0</div></div>
  </div>

  <canvas id="tetris" width="240" height="400"></canvas>

  <div class="controls">
    <div></div><div class="btn" onpointerdown="playerRotate(1)">🔄</div><div></div>
    <div class="btn" onpointerdown="playerMove(-1)">⬅️</div>
    <div class="btn" onpointerdown="playerDrop()">⬇️</div>
    <div class="btn" onpointerdown="playerMove(1)">➡️</div>
  </div>

  <div id="game-over-ui">
    <h2 style="color: #ffd700;">КІНЕЦЬ ГРИ 🗿</h2>
    <p>Твій рахунок: <span id="finalScore">0</span></p>
    <input type="text" id="playerName" placeholder="Введи свій нік">
    <button class="top-btn" onclick="saveToSupabase()">🚀 Опублікувати рекорд</button>
    <button onclick="location.reload()" style="background:none; color:white; border:none; margin-top:20px;">Заново</button>
  </div>

  <div id="leaderboard-overlay">
    <h2 style="color: #ffd700;">🏆 ТОР-10 ГЕРОЇВ</h2>
    <div class="list-container" id="leaderList"></div>
    <button class="btn" style="padding:10px 30px; margin-top:20px;" onclick="document.getElementById('leaderboard-overlay').style.display='none'">Закрити</button>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const supabaseUrl = 'https://etwbvrrbflvyxkvetsir.supabase.co';
    const supabaseKey = 'sb_publishable_qd7oP1_Db2k5GFGNNDruHQ_I6ww6f9E';
    const supabase = createClient(supabaseUrl, supabaseKey);

    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: 'https://providnykzpoun-bit.github.io/Tetris/tonconnect-manifest.json',
        buttonRootId: 'ton-connect-button'
    });

    tonConnectUI.onStatusChange(wallet => {
        document.getElementById('payButton').style.display = wallet ? 'block' : 'none';
    });

    // ОПЛАТА VIP
    window.sendPayment = async function() {
        const transaction = {
            validUntil: Math.floor(Date.now() / 1000) + 60,
            messages: [{ address: "UQDXq1iAqu88tVRG62_k03kAXELu_1gzRBMye-VZoFRIRtWw", amount: "10000000" }]
        };
        try {
            await tonConnectUI.sendTransaction(transaction);
            dropInterval = 400; // Пришвидшуємо гру для VIP
            alert("VIP Активовано! Гра стала швидшою.");
        } catch (e) { alert("Оплату скасовано"); }
    }

    // ЗБЕРЕЖЕННЯ В SUPABASE
    window.saveToSupabase = async function() {
        const wallet = tonConnectUI.wallet;
        const name = document.getElementById('playerName').value || "Анонім";
        const score = parseInt(document.getElementById('finalScore').innerText);

        if (!wallet) return alert("Підключи гаманець!");

        const { error } = await supabase.from('players').upsert([{ 
            wallet: wallet.account.address, 
            username: name,
            score: score 
        }], { onConflict: 'wallet' });

        if (error) alert("Помилка бази: " + error.message);
        else { alert("Збережено!"); location.reload(); }
    }

    // ЛІДЕРБОРД
    window.showLeaderboard = async function() {
        document.getElementById('leaderboard-overlay').style.display = 'flex';
        const { data } = await supabase.from('players').select('username, score').order('score', {ascending: false}).limit(10);
        document.getElementById('leaderList').innerHTML = data ? data.map((p, i) => `
            <div class="player-row"><span>${i+1}. ${p.username}</span><span>${p.score}</span></div>
        `).join('') : "Порожньо";
    }

    // --- ЛОГІКА ТЕТРІСУ ---
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    context.scale(20, 20);

    function createPiece(t) {
        if(t==='I') return [[0,1,0,0],[0,1,0,0],[0,1,0,0],[0,1,0,0]];
        if(t==='L') return [[0,2,0],[0,2,0],[0,2,2]];
        if(t==='J') return [[0,3,0],[0,3,0],[3,3,0]];
        if(t==='O') return [[4,4],[4,4]];
        if(t==='Z') return [[5,5,0],[0,5,5],[0,0,0]];
        if(t==='S') return [[0,6,6],[6,6,0],[0,0,0]];
        if(t==='T') return [[0,7,0],[7,7,7],[0,0,0]];
    }

    const colors = [null, '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'];
    const arena = Array.from({length: 20}, () => new Array(12).fill(0));
    const player = { pos: {x: 0, y: 0}, matrix: null, score: 0 };

    function draw() {
        context.fillStyle = '#000';
        context.fillRect(0, 0, canvas.width, canvas.height);
        drawMatrix(arena, {x:0, y:0});
        drawMatrix(player.matrix, player.pos);
    }

    function drawMatrix(m, o) {
        m.forEach((row, y) => row.forEach((v, x) => {
            if (v !== 0) { context.fillStyle = colors[v]; context.fillRect(x + o.x, y + o.y, 1, 1); }
        }));
    }

    function collide(a, p) {
        const [m, o] = [p.matrix, p.pos];
        for (let y = 0; y < m.length; ++y) {
            for (let x = 0; x < m[y].length; ++x) {
                if (m[y][x] !== 0 && (a[y+o.y] && a[y+o.y][x+o.x]) !== 0) return true;
            }
        }
        return false;
    }

    function merge(a, p) {
        p.matrix.forEach((row, y) => row.forEach((v, x) => {
            if (v !== 0) a[y + p.pos.y][x + p.pos.x] = v;
        }));
    }

    function playerReset() {
        const pieces = 'ILJOTSZ';
        player.matrix = createPiece(pieces[Math.random() * pieces.length | 0]);
        player.pos.y = 0;
        player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
        if (collide(arena, player)) {
            document.getElementById('finalScore').innerText = player.score;
            document.getElementById('game-over-ui').style.display = 'flex';
            player.score = 0;
        }
    }

    window.playerDrop = function() {
        player.pos.y++;
        if (collide(arena, player)) {
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
        }
        dropCounter = 0;
    }

    window.playerMove = function(d) { player.pos.x += d; if (collide(arena, player)) player.pos.x -= d; }
    window.playerRotate = function(d) {
        const pos = player.pos.x;
        let offset = 1;
        rotate(player.matrix, d);
        while (collide(arena, player)) {
            player.pos.x += offset;
            offset = -(offset + (offset > 0 ? 1 : -1));
            if (offset > player.matrix[0].length) { rotate(player.matrix, -d); player.pos.x = pos; return; }
        }
    }

    function rotate(m, d) {
        for (let y = 0; y < m.length; ++y) for (let x = 0; x < y; ++x) [m[x][y], m[y][x]] = [m[y][x], m[x][y]];
        if (d > 0) m.forEach(r => r.reverse()); else m.reverse();
    }

    function arenaSweep() {
        outer: for (let y = arena.length - 1; y > 0; --y) {
            for (let x = 0; x < arena[y].length; ++x) if (arena[y][x] === 0) continue outer;
            arena.splice(y, 1);
            arena.unshift(new Array(12).fill(0));
            player.score += 10;
        }
        document.getElementById('score').innerText = player.score;
    }

    let dropCounter = 0;
    let dropInterval = 1000;
    let lastTime = 0;
    function update(time = 0) {
        const dt = time - lastTime;
        lastTime = time;
        dropCounter += dt;
        if (dropCounter > dropInterval) playerDrop();
        draw();
        requestAnimationFrame(update);
    }

    playerReset();
    update();
  </script>
</body>
</html>
