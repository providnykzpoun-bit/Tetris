<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UA TETRIS 🗿</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body { background: #111; color: white; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; margin: 0; padding: 5px; touch-action: none; overflow: hidden; height: 100vh; }
        
        /* Виправляємо контейнер кнопки, щоб вона завжди відображалась і не пропадала */
        #ton-connect { margin-bottom: 6px; min-height: 45px; width: 100%; display: flex; justify-content: center; z-index: 100; }
        
        .top-link-btn { width: 280px; background: #ffd700; color: #000; padding: 10px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 13px; margin-bottom: 6px; text-align: center; display: block; border: none; cursor: pointer; }

        .info-row { display: flex; gap: 8px; width: 280px; margin-bottom: 6px; }
        .info-item { flex: 1; background: #1a1a1a; border: 1px solid #ffd700; border-radius: 8px; padding: 4px 2px; text-align: center; }
        .info-label { font-size: 8px; color: #ffd700; text-transform: uppercase; margin-bottom: 2px; display: block; }
        .info-value { font-size: 14px; font-weight: bold; color: #ffd700; }

        #winButton { display: none; width: 280px; padding: 10px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 13px; margin-bottom: 6px; text-align: center; background: #28a745; color: white; border: none; cursor: pointer; animation: pulse 1.5s infinite; z-index: 101; box-sizing: border-box; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        .score-panel { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
        .side-btn { background: #333; border: 1px solid #444; color: white; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; user-select: none; }
        .stats-row { display: flex; gap: 4px; }
        .stat-box { background: #222; padding: 4px; border-radius: 6px; border: 1px solid #333; min-width: 50px; text-align: center; }
        .stat-label { font-size: 7px; color: #aaa; text-transform: uppercase; }
        .stat-value { font-size: 14px; font-weight: bold; color: #00d4ff; }
        
        .next-box { background: #222; border: 1px solid #333; border-radius: 6px; width: 45px; height: 36px; display: flex; align-items: center; justify-content: center; position: relative; }
        #nextCanvas { width: 32px; height: 32px; display: block; }

        canvas#tetris { border: 2px solid #333; background: #000; width: 200px; height: 340px; border-radius: 8px; display: block; }
        
        .controls { display: flex; gap: 6px; margin-top: 8px; }
        .btn { background: #333; border: 1px solid #444; color: white; width: 50px; height: 50px; border-radius: 12px; font-size: 18px; display: flex; align-items: center; justify-content: center; user-select: none; touch-action: manipulation; }
        .btn-drop { background: #1d3557; border-color: #457b9d; }

        .overlay { display: none; background: rgba(0,0,0,0.9); position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .content { background: #1a1a1a; padding: 20px; border-radius: 20px; text-align: center; border: 2px solid #ffd700; max-width: 280px; }
    </style>
</head>
<body>

    <!-- Змінено id на стандартний для автоматичного рендерингу TonConnect -->
    <div id="ton-connect"></div>
    <a href="defender.html" class="top-link-btn">🛡️ UA DEFENDER — ЗАХИСТИ КОРДОН!</a>

    <div class="info-row">
        <div class="info-item" style="flex: 2;">
            <span class="info-label">Доступно до виплати</span>
            <div id="balanceValue" class="info-value">2000 UA</div>
        </div>
    </div>

    <button id="winButton" onclick="withdrawUA()">💰 ВИВЕСТИ 2000 UA</button>

    <div class="score-panel">
        <div class="side-btn" onclick="toggleSound()" id="soundBtn">🔊</div>
        <div class="stats-row">
            <div class="stat-box"><div class="stat-label">Очки</div><div id="score" class="stat-value">0</div></div>
            <div class="stat-box"><div class="stat-label">Рівень</div><div id="level" class="stat-value">1</div></div>
        </div>
        <div class="next-box" title="Наступна фігура">
            <canvas id="nextCanvas" width="40" height="40"></canvas>
        </div>
        <div class="side-btn" onclick="showRules()">?</div>
    </div>

    <canvas id="tetris" width="240" height="400"></canvas>

    <div class="controls">
        <div class="btn" onpointerdown="playerMove(-1)">⬅️</div>
        <div class="btn" onpointerdown="playerRotate()">🔄</div>
        <div class="btn btn-drop" onpointerdown="playerHardDrop()">⚡</div>
        <div class="btn" onpointerdown="playerDrop()">⬇️</div>
        <div class="btn" onpointerdown="playerMove(1)">➡️</div>
    </div>

    <div id="unlockBox" class="overlay">
        <div class="content">
            <h2 style="color:#ffd700">ПЕРШИЙ РІВЕНЬ ПРОЙДЕНО!</h2>
            <p>Набрано 20 очок. Розблокуйте фінальний етап для виплати 2000 UA!</p>
            <button class="top-link-btn" onclick="payAndContinue()">🔓 РОЗБЛОКУВАТИ (0.01 TON)</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Ініціалізація TonConnect через Data URI, щоб повністю уникнути помилки маніфесту (жовтого каченяти)
        const manifestData = {
            url: window.location.origin + window.location.pathname.replace(/\/[^/]*$/, ''),
            name: "UA TETRIS",
            iconUrl: "https://avatars.githubusercontent.com/u/1?v=4"
        };
        const manifestJson = JSON.stringify(manifestData);
        const manifestUrl = "data:application/json;base64," + btoa(unescape(encodeURIComponent(manifestJson)));

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: manifestUrl,
            buttonRootId: 'ton-connect'
        });

        let soundEnabled = true;
        let audioCtx = null;
        function playTone(freq, type, duration) {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function withdrawUA() {
            const wallet = tonConnectUI.account ? tonConnectUI.account.address : "Не підключено";
            const text = `ЗАЯВКА НА ВИПЛАТУ:%0A🎮 Гра: UA TETRIS 🗿%0A💰 Сума: 2000 UA%0A👛 Гаманець: ${wallet}`;
            
            window.open(`https://t.me/tokenpist_bot?text=${text}`, '_blank');

            document.getElementById('balanceValue').innerText = '0 UA';
            document.getElementById('winButton').style.display = 'none';
        }

        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        context.scale(20, 20);

        const nextCanvas = document.getElementById('nextCanvas');
        const nextCtx = nextCanvas.getContext('2d');
        nextCtx.scale(8, 8);

        const colors = [null, '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF', '#0055FF'];
        const arena = Array.from({length: 20}, () => new Array(12).fill(0));
        
        const player = { pos: {x: 0, y: 0}, matrix: null, score: 0 };
        let nextPieceMatrix = null;

        let isVip = false, isPaused = false, dropInterval = 800, dropCounter = 0, lastTime = 0;

        function createPiece(type) {
            if (type === 'I') return [[0,1,0,0],[0,1,0,0],[0,1,0,0],[0,1,0,0]];
            if (type === 'L') return [[0,2,0],[0,2,0],[0,2,2]];
            if (type === 'J') return [[0,3,0],[0,3,0],[3,3,0]];
            if (type === 'O') return [[4,4],[4,4]];
            if (type === 'Z') return [[5,5,0],[0,5,5],[0,0,0]];
            if (type === 'S') return [[0,6,6],[6,6,0],[0,0,0]];
            if (type === 'T') return [[0,7,0],[7,7,7],[0,0,0]];
            if (type === 'UA') return [[8,8],[8,8]];
        }

        function getRandomPiece() {
            const pieces = 'ILJOTSZ';
            let chosen = pieces[Math.floor(Math.random() * pieces.length)];
            if (Math.random() < 0.15) chosen = 'UA';
            return createPiece(chosen);
        }

        function drawMatrix(mat, offset, ctx = context) {
            mat.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        ctx.fillStyle = colors[value];
                        ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        function drawNext() {
            nextCtx.fillStyle = '#222';
            nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
            if (nextPieceMatrix) {
                const offsetX = (5 - nextPieceMatrix[0].length) / 2;
                const offsetY = (5 - nextPieceMatrix.length) / 2;
                drawMatrix(nextPieceMatrix, {x: offsetX, y: offsetY}, nextCtx);
            }
        }

        function draw() {
            context.fillStyle = '#000';
            context.fillRect(0, 0, canvas.width, canvas.height);
            drawMatrix(arena, {x: 0, y: 0});
            drawMatrix(player.matrix, player.pos);
        }

        function collide(arena, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) return true;
                }
            }
            return false;
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value;
                });
            });
            playTone(150, 'square', 0.1);
        }

        function arenaSweep() {
            let rowCount = 0;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) continue outer;
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                rowCount++;
                y++;
            }
            if (rowCount > 0) {
                player.score += rowCount * 10;
                playTone(600, 'sine', 0.2);
                updateScore();
            }
        }

        function updateScore() {
            document.getElementById('score').innerText = player.score;
            const lvl = Math.floor(player.score / 20) + 1;
            document.getElementById('level').innerText = lvl;

            if (player.score >= 20 && !isVip) {
                isPaused = true;
                document.getElementById('unlockBox').style.display = 'flex';
                playTone(800, 'triangle', 0.4);
            }
            if (player.score >= 40 && isVip && document.getElementById('balanceValue').innerText !== '0 UA') {
                document.getElementById('winButton').style.display = 'block';
            }
        }

        function playerReset() {
            if (!nextPieceMatrix) {
                nextPieceMatrix = getRandomPiece();
            }
            player.matrix = nextPieceMatrix;
            nextPieceMatrix = getRandomPiece();
            drawNext();

            player.pos.y = 0;
            player.pos.x = Math.floor(arena[0].length / 2) - Math.floor(player.matrix[0].length / 2);
            
            if (collide(arena, player)) {
                arena.forEach(row => row.fill(0));
                player.score = 0;
                playTone(100, 'sawtooth', 0.5);
                updateScore();
            }
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
            }
            dropCounter = 0;
        }

        function playerHardDrop() {
            if (isPaused) return;
            while (!collide(arena, player)) {
                player.pos.y++;
            }
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
            dropCounter = 0;
            playTone(400, 'square', 0.15);
        }

        function playerMove(dir) {
            if (isPaused) return;
            player.pos.x += dir;
            if (collide(arena, player)) player.pos.x -= dir;
            else playTone(300, 'sine', 0.03);
        }

        function playerRotate() {
            if (isPaused) return;
            const pos = player.pos.x;
            let offset = 1;
            const matrix = player.matrix;
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
            }
            matrix.forEach(row => row.reverse());
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > matrix[0].length) { player.pos.x = pos; return; }
            }
            playTone(450, 'sine', 0.05);
        }

        function update(time = 0) {
            if (!isPaused) {
                const deltaTime = time - lastTime;
                lastTime = time;
                dropCounter += deltaTime;
                if (dropCounter > dropInterval) playerDrop();
                draw();
            }
            requestAnimationFrame(update);
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundBtn').innerText = soundEnabled ? '🔊' : '🔈';
        }

        function showRules() { 
            alert('Збирайте очки! На 20 очках — розблокування, на 40 — виплата 2000 UA!'); 
        }

        async function payAndContinue() {
            if (!tonConnectUI.connected) {
                alert('Будь ласка, підключіть гаманець зверху!');
                return;
            }

            const transaction = {
                validUntil: Math.floor(Date.now() / 1000) + 300,
                messages: [
                    {
                        address: "UQDXq1iAqu88tVRG62_k03kAXELu_1gzRBMye-VZoFRIRtWw",
                        amount: "10000000" // 0.01 TON
                    }
                ]
            };

            try {
                await tonConnectUI.sendTransaction(transaction);
                isVip = true; 
                isPaused = false; 
                document.getElementById('unlockBox').style.display = 'none';
            } catch (e) {
                console.log("Транзакція скасована", e);
            }
        }

        playerReset();
        update();
    </script>
</body>
</html>
