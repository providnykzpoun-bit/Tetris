<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UA TETRIS 🗿</title>

  <style>
    body { background: #111; color: white; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; margin: 0; padding: 5px; touch-action: none; overflow: hidden; height: 100vh; }
    #ton-connect-button { margin-bottom: 10px; min-height: 44px; z-index: 100; }
    .menu-btn { width: 260px; padding: 12px; margin: 5px 0; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-size: 14px; }
    #payButton { background: #0088cc; color: white; display: none; }
    .top-btn { background: #ffd700; color: #000; }
    
    .header { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; align-items: center; width: 100%; }
    .jackpot-box { background: linear-gradient(45deg, #1a1a1a, #2a2a2a); border: 2px solid #ffd700; padding: 10px; border-radius: 12px; text-align: center; width: 240px; position: relative; }
    .stats-row { display: flex; gap: 10px; }
    .stat-box { background: #222; padding: 8px 15px; border-radius: 8px; border: 1px solid #333; min-width: 90px; text-align: center; }
    .label { font-size: 10px; color: #aaa; text-transform: uppercase; }
    .value { font-size: 18px; font-weight: bold; color: #00d4ff; }
    .jackpot-value { font-size: 22px; color: #ffd700; font-weight: 900; }

    canvas { border: 3px solid #333; background: #000; width: 240px; height: 400px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    .controls { display: grid; grid-template-columns: repeat(3, 65px); gap: 10px; margin-top: 15px; }
    .btn { background: #333; border: 1px solid #444; color: white; width: 65px; height: 65px; border-radius: 15px; font-size: 24px; display: flex; align-items: center; justify-content: center; active: background: #555; }
    
    .overlay { display:none; background: rgba(0,0,0,0.9); position: fixed; top:0; left:0; width:100%; height:100%; z-index:1000; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .content { background: #1a1a1a; padding: 25px; border-radius: 20px; width: 90%; max-width: 300px; text-align: center; border: 2px solid #ffd700; }
    .q-mark { position: absolute; right: 10px; top: 10px; cursor: pointer; font-size: 14px; background: #333; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border: 1px solid #ffd700; color: #ffd700; }
  </style>
</head>
<body>

  <div id="ton-connect-button"></div>
  
  <button id="payButton" class="menu-btn" onclick="sendPayment()">🔓 VIP Level (0.01 TON)</button>
  <button class="menu-btn top-btn" onclick="showLeaderboard()">🏆 ТОР ГРАВЦІВ</button>

  <div class="header">
    <div class="jackpot-box">
        <div class="q-mark" onclick="toggleOverlay('rulesBox', true)">?</div>
        <div class="label" style="color: #ffd700;">Призовий фонд</div>
        <div id="jackpot" class="jackpot-value">0.00 TON</div>
    </div>
    <div class="stats-row">
        <div class="stat-box"><div class="label">Очки</div><div id="score" class="value">0</div></div>
        <div class="stat-box"><div class="label">Рекорд</div><div id="best" class="value">0</div></div>
    </div>
  </div>

  <canvas id="tetris" width="240" height="400"></canvas>

  <div class="controls">
    <div></div><div class="btn" onclick="playerRotate()">🔄</div><div></div>
    <div class="btn" onclick="playerMove(-1)">⬅️</div>
    <div class="btn" onclick="playerDrop()">⬇️</div>
    <div class="btn" onclick="playerMove(1)">➡️</div>
  </div>

  <div id="rulesBox" class="overlay">
    <div class="content">
      <h3 style="color:#ffd700;">📜 ПРАВИЛА</h3>
      <p style="text-align: left; font-size: 14px; line-height: 1.5;">Всі VIP-внески йдуть у фонд. Щонеділі ТОП-3 гравців отримують виплати: 50%, 25% та 15% від банку.</p>
      <button class="menu-btn top-btn" onclick="toggleOverlay('rulesBox', false)">OK</button>

  </div>

      <h2 style="color:#ff4444">КІНЕЦЬ ГРИ</h2>
      <p style="font-size: 20px;">Рахунок: <span id="finalScore">0</span></p>
      <input type="text" id="pName" placeholder="Введіть нік" style="padding:12px; width:100%; border-radius:8px; border:none; margin-bottom:10px; box-sizing: border-box;">
      <button class="menu-btn top-btn" onclick="saveRecord()">ЗБЕРЕГТИ</button>
      <button onclick="location.reload()" style="background:none; color:#aaa; border:none; margin-top:15px; cursor:pointer;">Спробувати ще раз</button>
    </div>
  </div>

                    context.lineWidth = 0.05;
                    context.strokeRect(x + offset.x, y + offset.y, 1, 1);
                }
            });
        });
