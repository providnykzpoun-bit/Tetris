<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UA TETRIS 🗿</title>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <style>
    body { background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; margin: 0; padding: 10px; overflow-x: hidden; touch-action: none; }
    .header { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; width: 100%; justify-content: center; }
    .stat-box { text-align: center; background: #333; padding: 5px 10px; border-radius: 8px; border: 1px solid #444; min-width: 50px; }
    .label { font-size: 9px; color: #aaa; text-transform: uppercase; }
    .value { font-size: 18px; font-weight: bold; color: #00d4ff; }
    #ton-connect-button { margin-bottom: 10px; }
    .pay-section { margin-bottom: 10px; width: 100%; display: flex; justify-content: center; }
    .pay-btn { background: #0088cc; color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; display: none; }
    canvas { border: 2px solid #555; background: #000; width: 280px; height: 400px; border-radius: 10px; }
    .controls { display: grid; grid-template-columns: repeat(3, 80px); grid-gap: 15px; margin-top: 15px; }
    .btn { background: #333; border: 2px solid #555; color: white; padding: 20px; border-radius: 15px; font-size: 25px; text-align: center; user-select: none; }
    .rotate { grid-column: 2; background: #444; }
  </style>
</head>
<body>

  <div id="ton-connect-button"></div>

  <div class="pay-section">
    <button id="payButton" class="pay-btn" onclick="sendPayment()">🔓 Наст. рівень (0.01 TON)</button>
  </div>

  <div class="header">
    <div class="stat-box">
      <div class="label">Score</div>
      <div class="value" id="score">0</div>
    </div>
    <div class="stat-box">
      <div class="label">Best</div>
      <div class="value" id="best">0</div>
    </div>
    <button style="background:#444; border:none; color:white; border-radius:50%; width:40px; height:40px;" onclick="toggleMusic()">🔈</button>
  </div>

  <canvas id="tetris" width="240" height="400"></canvas>

  <div class="controls">
    <div></div>
    <div class="btn rotate" onpointerdown="playerRotate(1)">🔄</div>
    <div></div>
    <div class="btn" onpointerdown="playerMove(-1)">⬅️</div>
    <div class="btn" onpointerdown="playerDrop()">⬇️</div>
    <div class="btn" onpointerdown="playerMove(1)">➡️</div>
  </div>

  <audio id="bgMusic" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" type="audio/mpeg">
  </audio>

  <script>
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: 'https://providnykzpoun-bit.github.io/Tetris/tonconnect-manifest.json',
        buttonRootId: 'ton-connect-button'
    });

    tonConnectUI.onStatusChange(wallet => {
        document.getElementById('payButton').style.display = wallet ? 'block' : 'none';
    });

    async function sendPayment() {
        const transaction = {
            validUntil: Math.floor(Date.now() / 1000) + 120,
            messages: [
                {
                    address: "UQDXq1iAqu88tVRG62_k03kAXELu_1gzRBMye-VZoFRIRtWw",
                    amount: "10000000" 
                }
            ]
        };

        try {
            await tonConnectUI.sendTransaction(transaction);
            alert("Оплата успішна! Швидкість гри збільшена.");
            dropInterval = 400; 
        } catch (e) {
            alert("Оплата скасована або сталася помилка.");
        }
    }

    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    const music = document.getElementById('bgMusic');
    context.scale(20, 20);

    let isMusicPlaying = false;
    let dropInterval = 1000;
    let bestScore = localStorage.getItem('ua_tetris_best') || 0;
    document.getElementById('best').innerText = bestScore;

    function toggleMusic() {
        if (isMusicPlaying) { music.pause(); } else { music.play(); }
        isMusicPlaying = !isMusicPlaying;
    }

    function createMatrix(w, h) {
        const matrix = [];
        while (h--) matrix.push(new Array(w).fill(0));
        return matrix;
    }

    function createPiece(type) {
        if (type === 'T') return [[0, 1, 0], [1, 1, 1], [0, 0, 0]];
        if (type === 'O') return [[2, 2], [2, 2]];
        if (type === 'L') return [[0, 3, 0], [0, 3, 0], [0, 3, 3]];
        if (type === 'J') return [[0, 4, 0], [0, 4, 0], [4, 4, 0]];
        if (type === 'I') return [[0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0]];
        if (type === 'S') return [[0, 6, 6], [6, 6, 0], [0, 0, 0]];
        if (type === 'Z') return [[7, 7, 0], [0, 7, 7], [0, 0, 0]];
    }

    function drawMatrix(matrix, offset) {
        matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    context.fillStyle = colors[value];
                    context.fillRect(x + offset.x, y + offset.y, 1, 1);
                }
            });
        });
    }

    function draw() {
        context.fillStyle = '#000';
        context.fillRect(0, 0, canvas.width, canvas.height);
        drawMatrix(arena, {x: 0, y: 0});
        drawMatrix(player.matrix, player.pos);
    }

    function merge(arena, player) {
        player.matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value;
            });
        });
    }

    function rotate(matrix, dir) {
        for (let y = 0; y < matrix.length; ++y) {
            for (let x = 0; x < y; ++x) {
                [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
            }
        }
        if (dir > 0) matrix.forEach(row => row.reverse());
        else matrix.reverse();
    }

    function playerDrop() {
        player.pos.y++;
        if (collide(arena, player)) {
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
            updateScore();
        }
        dropCounter = 0;
    }

    function playerMove(dir) {
        player.pos.x += dir;
        if (collide(arena, player)) player.pos.x -= dir;
    }

    function playerRotate(dir) {
        const pos = player.pos.x;
        let offset = 1;
        rotate(player.matrix, dir);
        while (collide(arena, player)) {
            player.pos.x += offset;
            offset = -(offset + (offset > 0 ? 1 : -1));
            if (offset > player.matrix[0].length) {
                rotate(player.matrix, -dir);
                player.pos.x = pos;
                return;
            }
        }
    }

    function collide(arena, player) {
        const [m, o] = [player.matrix, player.pos];
        for (let y = 0; y < m.length; ++y) {
            for (let x = 0; x < m[y].length; ++x) {
                if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) return true;
            }
        }
        return false;
    }

    function arenaSweep() {
        let rowCount = 1;
        outer: for (let y = arena.length - 1; y > 0; --y) {
            for (let x = 0; x < arena[y].length; ++x) {
                if (arena[y][x] === 0) continue outer;
            }
            const row = arena.splice(y, 1)[0].fill(0);
            arena.unshift(row);
            ++y;
            player.score += rowCount * 10;
            rowCount *= 2;
        }
    }

    function playerReset() {
        const pieces = 'ILJOTSZ';
        player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
        player.pos.y = 0;
        player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
        if (collide(arena, player)) {
            if (player.score > bestScore) {
                bestScore = player.score;
                localStorage.setItem('ua_tetris_best', bestScore);
                document.getElementById('best').innerText = bestScore;
            }
            arena.forEach(row => row.fill(0));
            player.score = 0;
            updateScore();
        }
    }

    function updateScore() {
        document.getElementById('score').innerText = player.score;
        if (player.score > bestScore) document.getElementById('best').innerText = player.score;
    }

    const colors = [null, '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'];
    const arena = createMatrix(12, 20);
    const player = { pos: {x: 0, y: 0}, matrix: null, score: 0 };

    let dropCounter = 0;
    let lastTime = 0;
    function update(time = 0) {
        const deltaTime = time - lastTime;
        lastTime = time;
        dropCounter += deltaTime;
        if (dropCounter > dropInterval) playerDrop();
        draw();
        requestAnimationFrame(update);
    }

    playerReset();
    updateScore();
    update();
  </script>
</body>
</html>
