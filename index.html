<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UA TETRIS 🗿</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --accent: #ffd700; --bg: #111; --panel: #1a1a1a; }
        body { background: var(--bg); color: white; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; margin: 0; padding: 10px; touch-action: none; overflow: hidden; height: 100vh; }
        
        #ton-connect-button { margin-bottom: 10px; width: 100%; max-width: 300px; }
        
        .score-panel { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; width: 100%; max-width: 300px; }
        .stat-box { background: #222; padding: 5px; border-radius: 8px; flex: 1; text-align: center; border: 1px solid #333; }
        .value { font-size: 18px; font-weight: bold; color: #00d4ff; }

        canvas { border: 3px solid #333; background: #000; height: 45vh; border-radius: 12px; }
        
        .controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; width: 100%; max-width: 320px; }
        .btn { background: #2a2a2a; border: 1px solid #444; color: white; height: 60px; border-radius: 15px; font-size: 22px; display: flex; align-items: center; justify-content: center; user-select: none; }
        .btn:active { background: #444; }

        .leaderboard { width: 100%; max-width: 300px; margin-top: 15px; background: var(--panel); border-radius: 10px; padding: 8px; font-size: 14px; }
        .leader-item { display: flex; justify-content: space-between; padding: 3px 5px; border-bottom: 1px solid #333; }

        .overlay { display:none; background: rgba(0,0,0,0.9); position: fixed; inset: 0; z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        .content { background: var(--panel); padding: 25px; border-radius: 24px; width: 80%; text-align: center; border: 2px solid var(--accent); }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #000; color: white; text-align: center; }
        .top-btn { width: 100%; background: var(--accent); color: #000; padding: 12px; border-radius: 12px; border: none; font-weight: bold; }
    </style>
</head>
<body>

    <div id="ton-connect-button"></div>
    
    <div class="score-panel">
        <div class="stat-box"><div id="score" class="value">0</div></div>
        <div class="stat-box"><div id="best" class="value">0</div></div>
    </div>

    <canvas id="tetris" width="240" height="400"></canvas>

    <div class="controls">
        <div class="btn" onpointerdown="playerMove(-1)">⬅️</div>
        <div class="btn" onpointerdown="playerRotate()">🔄</div>
        <div class="btn" onpointerdown="playerDrop()">⬇️</div>
        <div class="btn" onpointerdown="playerMove(1)">➡️</div>
    </div>

    <div class="leaderboard" id="leaderList">
        <div style="text-align:center; color:var(--accent); margin-bottom:5px;">🏆 ТАБЛИЦЯ РЕКОРДІВ</div>
        </div>

    <div id="gameOverBox" class="overlay">
        <div class="content">
            <h2 style="color:#ff4444">ГРА ЗАКІНЧЕНА</h2>
            <p>Твій рахунок: <span id="finalScore">0</span></p>
            <input type="text" id="playerName" placeholder="Введіть нік" maxlength="12">
            <button id="saveBtn" class="top-btn" onclick="saveRecord()">ЗБЕРЕГТИ РЕКОРД</button>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://etwbvrbfivyxxkvetsir.supabase.co'; 
        const supabaseKey = 'sb_publishable_qd7oP1_Db2k5GFGNNDruHQ_I6ww6f9E';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        // Завантаження ТОП-5
        async function loadLeaders() {
            const { data } = await supabaseClient
                .from('leaderboard')
                .select('player_name, score')
                .order('score', { ascending: false }).limit(5);
            
            const list = document.getElementById('leaderList');
            if (data && data.length > 0) {
                list.innerHTML = '<div style="text-align:center; color:var(--accent); margin-bottom:5px;">🏆 ТАБЛИЦЯ РЕКОРДІВ</div>';
                data.forEach((item, index) => {
                    list.innerHTML += `<div class="leader-item"><span>${index+1}. ${item.player_name}</span><b>${item.score}</b></div>`;
                });
            }
        }
        loadLeaders();

        // Збереження рекорду
        async function saveRecord() {
            const name = document.getElementById('playerName').value.trim() || "Гравець";
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerText = "ЗБЕРІГАЄМО...";

            const { error } = await supabaseClient
                .from('leaderboard')
                .insert([{ player_name: name, score: player.score }]);

            if (!error) location.reload();
            else { alert("Помилка!"); btn.disabled = false; btn.innerText = "ПОВТОРИТИ"; }
        }

        // ЛОГІКА ТЕТРІСУ
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        context.scale(20, 20);

        function createPiece(type) {
            if (type === 'I') return [[0,1,0,0],[0,1,0,0],[0,1,0,0],[0,1,0,0]];
            if (type === 'L') return [[0,2,0],[0,2,0],[0,2,2]];
            if (type === 'J') return [[0,3,0],[0,3,0],[3,3,0]];
            if (type === 'O') return [[4,4],[4,4]];
            if (type === 'Z') return [[5,5,0],[0,5,5],[0,0,0]];
            if (type === 'S') return [[0,6,6],[6,6,0],[0,0,0]];
            if (type === 'T') return [[0,7,0],[7,7,7],[0,0,0]];
        }

        const colors = [null, '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'];
        const arena = Array.from({length: 20}, () => new Array(12).fill(0));
        const player = { pos: {x: 0, y: 0}, matrix: null, score: 0 };

        function draw() {
            context.fillStyle = '#000';
            context.fillRect(0, 0, canvas.width, canvas.height);
            drawMatrix(arena, {x: 0, y: 0});
            drawMatrix(player.matrix, player.pos);
        }

        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.fillStyle = colors[value];
                        context.fillRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        function collide(arena, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) return true;
                }
            }
            return false;
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value;
                });
            });
        }

        function arenaSweep() {
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) continue outer;
                }
                arena.splice(y, 1);
                arena.unshift(new Array(12).fill(0));
                player.score += 10;
            }
            document.getElementById('score').innerText = player.score;
        }

        function playerReset() {
            const pieces = 'ILJOTSZ';
            player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
            player.pos.y = 0;
            player.pos.x = (arena[0].length/2|0) - (player.matrix[0].length/2|0);
            if (collide(arena, player)) {
                document.getElementById('finalScore').innerText = player.score;
                document.getElementById('gameOverBox').style.display = 'flex';
                cancelAnimationFrame(animationId);
            }
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
            }
            dropCounter = 0;
        }

        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(arena, player)) player.pos.x -= dir;
        }

        function playerRotate() {
            const matrix = player.matrix;
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            matrix.forEach(row => row.reverse());
            if (collide(arena, player)) matrix.forEach(row => row.reverse());
        }

        let dropCounter = 0;
        let lastTime = 0;
        let animationId;
        function update(time = 0) {
            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;
            if (dropCounter > 1000) playerDrop();
            draw();
            animationId = requestAnimationFrame(update);
        }

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://providnykzpoun-bit.github.io/Tetris/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        playerReset();
        update();
    </script>
</body>
</html>
