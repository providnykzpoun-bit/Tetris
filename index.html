<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UA TETRIS 🗿</title>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <style>
    body { background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; margin: 0; padding: 10px; overflow-x: hidden; touch-action: none; }
    .header { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; width: 100%; justify-content: center; }
    .stat-box { text-align: center; background: #333; padding: 5px 8px; border-radius: 8px; border: 1px solid #444; min-width: 60px; }
    .label { font-size: 9px; color: #aaa; text-transform: uppercase; }
    .value { font-size: 16px; font-weight: bold; color: #00d4ff; }
    
    .top-btn { background: #ffd700; color: #000; border: none; padding: 10px; border-radius: 8px; font-weight: bold; margin-bottom: 10px; width: 280px; cursor: pointer; }
    
    canvas { border: 2px solid #555; background: #000; width: 280px; height: 400px; border-radius: 10px; }
    .controls { display: grid; grid-template-columns: repeat(3, 80px); grid-gap: 15px; margin-top: 15px; }
    .btn { background: #333; border: 2px solid #555; color: white; padding: 20px; border-radius: 15px; font-size: 25px; text-align: center; }

    /* Стилі для списку лідерів */
    #leaderboard-overlay { display:none; background: rgba(0,0,0,0.95); position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 200; flex-direction: column; align-items: center; justify-content: center; }
    .list-container { background: #222; padding: 20px; border-radius: 15px; border: 1px solid #ffd700; width: 85%; max-height: 70%; overflow-y: auto; }
    .player-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #444; }
    .close-btn { margin-top: 20px; background: #444; color: white; border: none; padding: 10px 20px; border-radius: 8px; }
  </style>
</head>
<body>

  <div id="ton-connect-button"></div>
  <button class="top-btn" onclick="showLeaderboard()">🏆 ТОП ГРАВЦІВ (Leaderboard)</button>

  <div class="header">
    <div class="stat-box"><div class="label">Score</div><div id="score" class="value">0</div></div>
    <div class="stat-box"><div class="label">Best</div><div id="best" class="value">0</div></div>
  </div>

  <canvas id="tetris" width="240" height="400"></canvas>

  <div class="controls">
    <div></div><div class="btn" onpointerdown="playerRotate(1)">🔄</div><div></div>
    <div class="btn" onpointerdown="playerMove(-1)">⬅️</div>
    <div class="btn" onpointerdown="playerDrop()">⬇️</div>
    <div class="btn" onpointerdown="playerMove(1)">➡️</div>
  </div>

  <div id="leaderboard-overlay">
    <h2 style="color: #ffd700;">🏆 ТОР-10 ГЕРОЇВ</h2>
    <div class="list-container" id="leaderList">Завантаження...</div>
    <button class="close-btn" onclick="document.getElementById('leaderboard-overlay').style.display='none'">Закрити</button>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const supabaseUrl = 'https://etwbvrrbflvyxkvetsir.supabase.co';
    const supabaseKey = 'sb_publishable_qd7oP1_Db2k5GFGNNDruHQ_I6ww6f9E';
    const supabase = createClient(supabaseUrl, supabaseKey);

    // Функція показу лідерборду
    window.showLeaderboard = async function() {
        const overlay = document.getElementById('leaderboard-overlay');
        const list = document.getElementById('leaderList');
        overlay.style.display = 'flex';
        list.innerHTML = "Завантаження...";

        const { data, error } = await supabase
            .from('players')
            .select('username, score')
            .order('score', { ascending: false })
            .limit(10);

        if (error) {
            list.innerHTML = "Помилка завантаження";
        } else {
            list.innerHTML = data.map((p, i) => `
                <div class="player-row">
                    <span>${i+1}. ${p.username || 'Анонім'}</span>
                    <span style="color:#ffd700">${p.score}</span>
                </div>
            `).join('');
        }
    }

    // Решта логіки тетрісу залишається незмінною...
    // (Я скоротив тут текст, щоб ти міг просто додати функцію showLeaderboard у свій файл)
  </script>
</body>
</html>
