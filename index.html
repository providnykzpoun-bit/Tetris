<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UA TETRIS 🗿</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body { background: #111; color: white; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; margin: 0; padding: 5px; touch-action: none; overflow: hidden; height: 100vh; }
        #ton-connect-button { margin-bottom: 5px; min-height: 44px; display: flex; justify-content: center; width: 100%; }

        /* ВЕРХНІЙ БЛОК (VIP ТА ФОНД) */
        .top-info-row { display: flex; gap: 5px; width: 280px; margin-bottom: 5px; }
        .vip-btn { flex: 1.2; background: #0088cc; color: white; padding: 10px; border-radius: 8px; border: none; font-weight: bold; font-size: 11px; cursor: pointer; display: none; }
        .jackpot-box { flex: 1; background: #1a1a1a; border: 1px solid #ffd700; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 5px; }
        .jackpot-label { font-size: 8px; color: #ffd700; text-transform: uppercase; }
        .jackpot-value { font-size: 14px; color: #ffd700; font-weight: bold; }

        /* СЕРЕДНІЙ БЛОК (TOP ТА СПИСОК VIP) */
        .menu-row { display: flex; gap: 5px; width: 280px; margin-bottom: 5px; }
        .menu-btn { flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: bold; font-size: 12px; cursor: pointer; }
        .top-btn { background: #ffd700; color: #000; }
        .vip-list-btn { background: #0088cc; color: white; }

        /* ОЧКИ ТА РЕКОРД */
        .score-panel { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        .side-btn { background: #333; border: 1px solid #444; color: white; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .stats-row { display: flex; gap: 5px; }
        .stat-box { background: #222; padding: 5px; border-radius: 6px; border: 1px solid #333; min-width: 70px; text-align: center; }
        .label { font-size: 8px; color: #aaa; text-transform: uppercase; }
        .value { font-size: 14px; font-weight: bold; color: #00d4ff; }

        canvas { border: 2px solid #333; background: #000; width: 220px; height: 380px; border-radius: 8px; }
        
        .controls { display: flex; gap: 8px; margin-top: 10px; }
        .btn { background: #333; border: 1px solid #444; color: white; width: 55px; height: 55px; border-radius: 12px; font-size: 20px; display: flex; align-items: center; justify-content: center; }

        .overlay { display:none; background: rgba(0,0,0,0.9); position: fixed; top:0; left:0; width:100%; height:100%; z-index:1000; flex-direction: column; align-items: center; justify-content: center; }
        .content { background: #1a1a1a; padding: 20px; border-radius: 20px; width: 80%; text-align: center; border: 2px solid #ffd700; }
    </style>
</head>
<body>

    <div id="ton-connect-button"></div>
    
    <div class="top-info-row">
        <button id="payButton" class="vip-btn" onclick="sendPayment()">🔓 VIP (0.01 TON)</button>
        <div class="jackpot-box">
            <div class="jackpot-label">Призовий фонд</div>
            <div id="jackpot" class="jackpot-value">0.00 TON</div>
        </div>
    </div>

    <div class="menu-row">
        <button class="menu-btn top-btn" onclick="location.reload()">🏆 TOP</button>
        <button class="menu-btn vip-list-btn" onclick="showVips()">💎 VIP ГРАВЦІ</button>
    </div>

    <div class="score-panel">
        <div class="side-btn" onclick="toggleSound()" id="soundBtn">🔊</div>
        <div class="stats-row">
            <div class="stat-box"><div class="label">Очки</div><div id="score" class="value">0</div></div>
            <div class="stat-box"><div class="label">Рекорд</div><div id="best" class="value">0</div></div>
        </div>
        <div class="side-btn" onclick="showRules()">?</div>
    </div>

    <canvas id="tetris" width="240" height="400"></canvas>

    <div class="controls">
        <div class="btn" onclick="playerMove(-1)">⬅️</div>
        <div class="btn" onclick="playerRotate()">🔄</div>
        <div class="btn" onclick="playerDrop()">⬇️</div>
        <div class="btn" onclick="playerMove(1)">➡️</div>
    </div>

    <div id="vipsBox" class="overlay">
        <div class="content">
            <h3 style="color:#00d4ff;">ОСТАННІ VIP</h3>
            <div id="vipsList" style="text-align: left; font-family: monospace; margin: 15px 0;">Завантаження...</div>
            <button class="menu-btn top-btn" onclick="document.getElementById('vipsBox').style.display='none'">ЗАКРИТИ</button>
        </div>
    </div>

    <script>
        // Тут залишається вся ваша логіка TONConnect, оновлення джекпоту та самого Тетрісу
        // Код виправлений для правильного відображення кнопок як на попередніх фото
    </script>
</body>
</html>
