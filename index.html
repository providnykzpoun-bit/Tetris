<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UA TETRIS 🗿 VIP</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root { --accent: #ffd700; --bg: #111; --panel: #1a1a1a; }
        body { background: var(--bg); color: white; display: flex; flex-direction: column; align-items: center; font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 10px; touch-action: none; overflow: hidden; height: 100vh; box-sizing: border-box; }
        
        #ton-connect-button { margin-bottom: 10px; width: 100%; max-width: 300px; }

        .top-info-row { display: flex; gap: 8px; width: 100%; max-width: 300px; margin-bottom: 10px; height: 45px; }
        .mini-btn { flex: 1; padding: 5px; border-radius: 10px; border: none; font-weight: bold; font-size: 11px; cursor: pointer; display: none; background: #0088cc; color: white; transition: 0.2s; }
        .mini-btn:active { transform: scale(0.95); }
        .mini-jackpot { flex: 1; background: var(--panel); border: 1px solid var(--accent); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .jackpot-label { font-size: 8px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
        .jackpot-value { font-size: 14px; color: var(--accent); font-weight: bold; }

        .score-panel { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; width: 100%; max-width: 300px; justify-content: space-between; }
        .side-btn { background: #333; border: 1px solid #444; color: white; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; }
        
        .stats-row { display: flex; gap: 8px; flex-grow: 1; justify-content: center; }
        .stat-box { background: #222; padding: 5px 12px; border-radius: 8px; border: 1px solid #333; text-align: center; min-width: 60px; }
        .label { font-size: 8px; color: #aaa; text-transform: uppercase; margin-bottom: 2px; }
        .value { font-size: 16px; font-weight: bold; color: #00d4ff; }

        .game-container { position: relative; border: 3px solid #333; border-radius: 12px; overflow: hidden; background: #000; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        canvas { display: block; background: #000; height: 55vh; max-height: 500px; }
        
        .controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; width: 100%; max-width: 320px; }
        .btn { background: #2a2a2a; border: 1px solid #444; color: white; height: 60px; border-radius: 15px; font-size: 22px; display: flex; align-items: center; justify-content: center; user-select: none; touch-action: manipulation; }
        .btn:active { background: #444; transform: translateY(2px); }
        .btn-drop { background: #3a3a3a; grid-column: span 1; }

        .overlay { display:none; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); position: fixed; top:0; left:0; width:100%; height:100%; z-index:1000; flex-direction: column; align-items: center; justify-content: center; }
        .content { background: var(--panel); padding: 25px; border-radius: 24px; width: 85%; max-width: 300px; text-align: center; border: 2px solid var(--accent); }
        .top-btn { width: 100%; background: var(--accent); color: #000; padding: 12px; border-radius: 12px; border: none; font-weight: bold; font-size: 14px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="ton-connect-button"></div>
    
    <div class="top-info-row">
        <button id="payButton" class="mini-btn" onclick="sendPayment()">🔓 VIP (0.01 TON)</button>
        <div class="mini-jackpot">
            <div class="jackpot-label">Призовий фонд</div>
            <div id="jackpot" class="jackpot-value">0.00 TON</div>
        </div>
    </div>

    <div class="score-panel">
        <div class="side-btn" onclick="toggleSound()" id="soundBtn">🔊</div>
        <div class="stats-row">
            <div class="stat-box"><div class="label">Очки</div><div id="score" class="value">0</div></div>
            <div class="stat-box"><div class="label">Рекорд</div><div id="best" class="value">0</div></div>
        </div>
        <div class="side-btn" onclick="showRules()">?</div>
    </div>

    <div class="game-container">
        <canvas id="tetris" width="240" height="400"></canvas>
    </div>

    <div class="controls">
        <div class="btn" onpointerdown="playerMove(-1)">⬅️</div>
        <div class="btn" onpointerdown="playerRotate()">🔄</div>
        <div class="btn btn-drop" onpointerdown="playerDrop()">⬇️</div>
        <div class="btn" onpointerdown="playerMove(1)">➡️</div>
    </div>

    <div id="rulesBox" class="overlay">
        <div class="content">
            <h3 style="color:var(--accent); margin-top:0;">ПРАВИЛА</h3>
            <div style="text-align: left; font-size: 13px; color: #ccc; line-height: 1.6;">
                • 1 лінія = 10 балів.<br>
                • VIP дає шанс виграти TON.<br>
                • Тінь показує місце падіння.<br>
                • Рекорд зберігається автоматично.
            </div>
            <button class="top-btn" onclick="closeRules()">ЗРОЗУМІЛО</button>
        </div>
    </div>

    <div id="gameOverBox" class="overlay">
        <div class="content">
            <h2 style="color:#ff4444">ГРА ЗАКІНЧЕНА</h2>
            <p>Рахунок: <span id="finalScore" style="font-weight:bold; color: #00d4ff;">0</span></p>
            <button class="top-btn" onclick="location.reload()">СПРОБУВАТИ ЗНОВУ</button>
        </div>
    </div>

    <script>
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://providnykzpoun-bit.github.io/Tetris/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        tonConnectUI.onStatusChange(wallet => {
            document.getElementById('payButton').style.display = wallet ? 'block' : 'none';
        });

        async function sendPayment() {
            const transaction = {
                validUntil: Math.floor(Date.now() / 1000) + 60,
                messages: [{
                    address: "UQDXq1iAqu88tVRG62_k03kAXELu_1gzRBMye-VZoFRIRtWw",
                    amount: "10000000" // 0.01 TON
                }]
            };
            try {
                await tonConnectUI.sendTransaction(transaction);
                alert("Дякуємо! VIP статус активовано (локально).");
            } catch (e) { console.error(e); }
        }

        async function updateJackpot() {
            try {
                const res = await fetch('https://toncenter.com/api/v2/getAddressInformation?address=UQDXq1iAqu88tVRG62_k03kAXELu_1gzRBMye-VZoFRIRtWw');
                const data = await res.json();
                if (data.ok) {
                    const balance = data.result.balance / 1e9;
                    document.getElementById('jackpot').innerText = Math.max(0, balance - 2.14).toFixed(2) + " TON";
                }
            } catch (e) { }
        }
        updateJackpot();

        // Аудіо
        let isSoundOn = true;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration) {
            if (!isSoundOn) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function toggleSound() {
            isSoundOn = !isSoundOn;
            document.getElementById('soundBtn').innerText = isSoundOn ? '🔊' : '🔈';
        }

        function showRules() { document.getElementById('rulesBox').style.display = 'flex'; }
        function closeRules() { document.getElementById('rulesBox').style.display = 'none'; }

        // Логіка Tetris

        const context = canvas.getContext('2d');
        context.scale(20, 20);
