<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UA TETRIS 🗿</title>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <style>
    body { background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; margin: 0; padding: 10px; overflow-x: hidden; touch-action: none; }
    .header { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; width: 100%; justify-content: center; }
    .stat-box { text-align: center; background: #333; padding: 5px 8px; border-radius: 8px; border: 1px solid #444; min-width: 60px; }
    .label { font-size: 9px; color: #aaa; text-transform: uppercase; }
    .value { font-size: 16px; font-weight: bold; color: #00d4ff; }
    #ton-connect-button { margin-bottom: 10px; }
    canvas { border: 2px solid #555; background: #000; width: 280px; height: 400px; border-radius: 10px; }
    .controls { display: grid; grid-template-columns: repeat(3, 80px); grid-gap: 15px; margin-top: 15px; }
    .btn { background: #333; border: 2px solid #555; color: white; padding: 20px; border-radius: 15px; font-size: 25px; text-align: center; user-select: none; }
    #leaderboard-ui { display:none; background: rgba(0,0,0,0.95); position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; flex-direction: column; align-items: center; justify-content: center; }
    #playerName { padding: 12px; border-radius: 8px; border: 1px solid #555; background: #222; color: white; margin: 15px 0; width: 200px; }
    .share-btn { background: #0088cc; color: white; padding: 12px 25px; border: none; border-radius: 8px; font-weight: bold; }
  </style>
</head>
<body>

  <div id="ton-connect-button"></div>

  <div class="header">
    <div class="stat-box"><div class="label">Score</div><div id="score" class="value">0</div></div>
    <div class="stat-box"><div class="label">Best</div><div id="best" class="value">0</div></div>
    <div class="stat-box"><div class="label">Status</div><div id="statusDisplay" class="value" style="font-size:10px;">Offline</div></div>
  </div>

  <canvas id="tetris" width="240" height="400"></canvas>

  <div class="controls">
    <div></div><div class="btn" onpointerdown="playerRotate(1)">🔄</div><div></div>
    <div class="btn" onpointerdown="playerMove(-1)">⬅️</div>
    <div class="btn" onpointerdown="playerDrop()">⬇️</div>
    <div class="btn" onpointerdown="playerMove(1)">➡️</div>
  </div>

  <div id="leaderboard-ui">
    <h2 style="color: #ffd700;">GAME OVER 🗿</h2>
    <p>Твій результат: <span id="finalScore">0</span></p>
    <input type="text" id="playerName" placeholder="Твій нік">
    <button class="share-btn" onclick="saveRecord()">🚀 Зберегти в Supabase</button>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    // НАЛАШТУВАННЯ ТВОГО ПРОЕКТУ
    const supabaseUrl = 'https://etwbvrrbflvyxkvetsir.supabase.co';
    const supabaseKey = 'sb_publishable_qd7oP1_Db2k5GFGNNDruHQ_I6ww6f9E';
    const supabase = createClient(supabaseUrl, supabaseKey);

    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: 'https://providnykzpoun-bit.github.io/Tetris/tonconnect-manifest.json',
        buttonRootId: 'ton-connect-button'
    });

    tonConnectUI.onStatusChange(wallet => {
        document.getElementById('statusDisplay').innerText = wallet ? "Online" : "Connect Wallet";
        document.getElementById('statusDisplay').style.color = wallet ? "#00ff00" : "#ff0000";
    });

    // ФУНКЦІЯ ЗБЕРЕЖЕННЯ
    window.saveRecord = async function() {
        const wallet = tonConnectUI.wallet;
        const name = document.getElementById('playerName').value || "Анонім";
        const finalScore = parseInt(document.getElementById('finalScore').innerText);

        if (!wallet) {
            alert("Спочатку підключи гаманець!");
            return;
        }

        const { error } = await supabase.from('players').upsert([{ 
            wallet: wallet.account.address, 
            username: name,
            score: finalScore 
        }], { onConflict: 'wallet' });

        if (error) {
            alert("Помилка: " + error.message);
        } else {
            alert("Рекорд збережено! Перевір Supabase.");
            location.reload();
        }
    }

    // ЛОГІКА ТЕТРІСУ
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    context.scale(20, 20);

    const colors = [null, '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'];
    const arena = Array.from({length: 20}, () => new Array(12).fill(0));
    const player = { pos: {x: 0, y: 0}, matrix: null, score: 0 };

    function createPiece(t) {
        if(t==='I') return [[0,1,0,0],[0,1,0,0],[0,1,0,0],[0,1,0,0]];
        if(t==='L') return [[0,2,0],[0,2,0],[0,2,2]];
        if(t==='J') return [[0,3,0],[0,3,0],[3,3,0]];
        if(t==='O') return [[4,4],[4,4]];
        if(t==='Z') return [[5,5,0],[0,5,5],[0,0,0]];
        if(t==='S') return [[0,6,6],[6,6,0],[0,0,0]];
        if(t==='T') return [[0,7,0],[7,7,7],[0,0,0]];
    }

    function draw() {
        context.fillStyle = '#000';
        context.fillRect(0, 0, canvas.width, canvas.height);
        drawMatrix(arena, {x:0, y:0});
        drawMatrix(player.matrix, player.pos);
    }

    function drawMatrix(m, o) {
        m.forEach((row, y) => row.forEach((v, x) => {
            if (v !== 0) { context.fillStyle = colors[v]; context.fillRect(x + o.x, y + o.y, 1, 1); }
        }));
    }

    function collide(a, p) {
        const [m, o] = [p.matrix, p.pos];
        for (let y = 0; y < m.length; ++y) {
            for (let x = 0; x < m[y].length; ++x) {
                if (m[y][x] !== 0 && (a[y+o.y] && a[y+o.y][x+o.x]) !== 0) return true;
            }
        }
        return false;
    }

    function merge(a, p) {
        p.matrix.forEach((row, y) => row.forEach((v, x) => {
            if (v !== 0) a[y + p.pos.y][x + p.pos.x] = v;
        }));
    }

    function playerReset() {
        const pieces = 'ILJOTSZ';
        player.matrix = createPiece(pieces[Math.random() * pieces.length | 0]);
        player.pos.y = 0;
        player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
        if (collide(arena, player)) {
            document.getElementById('finalScore').innerText = player.score;
            document.getElementById('leaderboard-ui').style.display = 'flex';
            player.score = 0;
        }
    }

    window.playerDrop = function() {
        player.pos.y++;
        if (collide(arena, player)) {
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
        }
        dropCounter = 0;
    }

    window.playerMove = function(d) { player.pos.x += d; if (collide(arena, player)) player.pos.x -= d; }
    window.playerRotate = function(d) {
        const pos = player.pos.x;
        let offset = 1;
        rotate(player.matrix, d);
        while (collide(arena, player)) {
            player.pos.x += offset;
            offset = -(offset + (offset > 0 ? 1 : -1));
            if (offset > player.matrix[0].length) { rotate(player.matrix, -d); player.pos.x = pos; return; }
        }
    }

    function rotate(m, d) {
        for (let y = 0; y < m.length; ++y) for (let x = 0; x < y; ++x) [m[x][y], m[y][x]] = [m[y][x], m[x][y]];
        if (d > 0) m.forEach(r => r.reverse()); else m.reverse();
    }

    function arenaSweep() {
        outer: for (let y = arena.length - 1; y > 0; --y) {
            for (let x = 0; x < arena[y].length; ++x) if (arena[y][x] === 0) continue outer;
            arena.splice(y, 1);
            arena.unshift(new Array(12).fill(0));
            player.score += 10;
        }
        document.getElementById('score').innerText = player.score;
    }

    let dropCounter = 0;
    let lastTime = 0;
    function update(time = 0) {
        const dt = time - lastTime;
        lastTime = time;
        dropCounter += dt;
        if (dropCounter > 1000) playerDrop();
        draw();
        requestAnimationFrame(update);
    }

    playerReset();
    update();
  </script>
</body>
</html>
