<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UA TETRIS 🗿</title>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    body { background: #111; color: white; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; margin: 0; padding: 5px; touch-action: none; overflow: hidden; height: 100vh; }
    #ton-connect-button { margin: 5px 0; min-height: 44px; z-index: 100; }
    .menu-btn { width: 260px; padding: 10px; margin: 3px 0; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 14px; z-index: 10; }
    #payButton { background: #0088cc; color: white; display: none; }
    .top-btn { background: #ffd700; color: #000; }
    
    .header { display: flex; flex-direction: column; gap: 5px; margin-bottom: 5px; align-items: center; width: 100%; }
    .jackpot-box { background: linear-gradient(45deg, #222, #333); border: 2px solid #ffd700; padding: 10px 20px; border-radius: 12px; text-align: center; width: 220px; position: relative; }
    .stats-row { display: flex; gap: 8px; }
    
    .stat-box { text-align: center; background: #222; padding: 5px 12px; border-radius: 8px; border: 1px solid #333; min-width: 80px; }
    .label { font-size: 10px; color: #aaa; }
    .value { font-size: 16px; font-weight: bold; color: #00d4ff; }
    .jackpot-value { font-size: 20px; color: #ffd700; font-weight: 900; }

    canvas { border: 2px solid #444; background: #000; width: 220px; height: 380px; border-radius: 10px; }
    .controls { display: flex; justify-content: center; gap: 8px; margin-top: 10px; width: 100%; }
    .btn { background: #333; border: 2px solid #555; color: white; width: 55px; height: 55px; border-radius: 12px; font-size: 20px; display: flex; align-items: center; justify-content: center; user-select: none; }
    
    .overlay { display:none; background: rgba(0,0,0,0.95); position: fixed; top:0; left:0; width:100%; height:100%; z-index:1000; flex-direction: column; align-items: center; justify-content: center; }
    .content { background: #222; padding: 20px; border-radius: 15px; width: 85%; text-align: center; border: 1px solid #ffd700; }
    .q-mark { position: absolute; right: 8px; top: 8px; cursor: pointer; font-size: 16px; background: #444; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border: 1px solid #ffd700; color: #ffd700; }
  </style>
</head>
<body>

  <div id="ton-connect-button"></div>
  
  <button id="payButton" class="menu-btn" onclick="sendPayment()">🔓 VIP Level (0.01 TON)</button>
  <button class="menu-btn top-btn" onclick="showLeaderboard()">🏆 ТОР ГРАВЦІВ</button>

  <div class="header">
    <div class="jackpot-box">
        <div class="q-mark" onclick="document.getElementById('rulesBox').style.display='flex'">?</div>
        <div class="label" style="color: #ffd700;">ПРИЗОВИЙ ФОНД</div>
        <div id="jackpot" class="jackpot-value">0.00 TON</div>
    </div>
    <div class="stats-row">
        <div class="stat-box"><div class="label">SCORE</div><div id="score" class="value">0</div></div>
        <div class="stat-box"><div class="label">BEST</div><div id="best" class="value">0</div></div>
    </div>
  </div>

  <canvas id="tetris" width="240" height="400"></canvas>

  <div class="controls">
    <div class="btn" onpointerdown="playerMove(-1)">⬅️</div>
    <div class="btn" onpointerdown="playerRotate()">🔄</div>
    <div class="btn" onpointerdown="playerDrop()">⬇️</div>
    <div class="btn" onpointerdown="playerMove(1)">➡️</div>
  </div>

  <div id="rulesBox" class="overlay">
    <div class="content">
      <h3 style="color:#ffd700;">📜 ПРАВИЛА</h3>
      <p style="text-align: left; font-size: 13px;">Фонд формується з VIP-внесків. Виплати щонеділі для ТОП-3: 1-ше (50%), 2-ге (25%), 3-тє (15%). 10% — у наступний банк.</p>
      <button class="menu-btn top-btn" style="width:100%" onclick="document.getElementById('rulesBox').style.display='none'">ЗРОЗУМІЛО</button>
    </div>
  </div>

  <div id="gameOverBox" class="overlay">
    <div class="content">
      <h2 style="color:#ffd700">GAME OVER</h2>
      <p>Очки: <span id="finalScore">0</span></p>
      <input type="text" id="pName" placeholder="Твій нік" style="padding:10px; width:80%; margin-bottom:10px;">
      <button class="menu-btn top-btn" onclick="saveRecord()">Зберегти рекорд</button>
      <button onclick="location.reload()" style="background:none; color:white; border:none; margin-top:10px;">Заново</button>
    </div>
  </div>

  <div id="leaderBox" class="overlay">
    <div class="content">
      <h3>🏆 TOP-10</h3>
      <div id="leaderList" style="text-align:left; margin-bottom:15px; max-height: 200px; overflow-y: auto;"></div>
      <button class="menu-btn" style="background:#444; color:white;" onclick="document.getElementById('leaderBox').style.display='none'">Закрити</button>
    </div>
  </div>
