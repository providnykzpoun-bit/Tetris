<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UA TETRIS 🗿</title>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <style>
    body { background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 10px; overflow: hidden; touch-action: none; }
    .header { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; width: 100%; justify-content: center; }
    .stat-box { text-align: center; background: #262626; padding: 8px 12px; border-radius: 12px; border: 1px solid #444; min-width: 65px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .label { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    .value { font-size: 18px; font-weight: bold; color: #00d4ff; }
    .vip-border { border-color: #ffd700; box-shadow: 0 0 15px rgba(255, 215, 0, 0.4); }
    .vip-text { color: #ffd700 !important; }
    
    #ton-connect-button { margin-bottom: 10px; }
    .pay-btn { background: linear-gradient(135deg, #0088cc, #005588); color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; display: none; margin-bottom: 10px; width: 280px; box-shadow: 0 4px 15px rgba(0,136,204,0.4); }
    
    canvas { border: 3px solid #333; background: #000; width: 280px; height: 400px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    
    .controls { display: grid; grid-template-columns: repeat(3, 85px); grid-gap: 12px; margin-top: 15px; }
    .btn { background: #333; border: 1px solid #444; color: white; padding: 18px; border-radius: 18px; font-size: 28px; text-align: center; user-select: none; -webkit-tap-highlight-color: transparent; transition: transform 0.1s; }
    .btn:active { background: #444; transform: scale(0.95); }

    #leaderboard-ui { display:none; background: rgba(0,0,0,0.9); position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
    #playerName { padding: 14px; border-radius: 10px; border: 1px solid #444; background: #111; color: white; margin: 15px 0; width: 220px; font-size: 16px; text-align: center; }
    .share-btn { background: #0088cc; color: white; padding: 14px 30px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; }
    
    #reviveBtn { display: none; background: #e91e63; color: white; border: none; padding: 14px; border-radius: 10px; margin-top: 10px; font-weight: bold; width: 280px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
  </style>
</head>
<body>

  <div id="ton-connect-button"></div>
  <button id="payButton" class="pay-btn" onclick="sendPayment()">🔓 Активувати VIP Level (0.01 TON)</button>

  <div class="header">
    <div class="stat-box">
      <div class="label">Очки</div>
      <div id="score" class="value">0</div>
    </div>
    <div class="stat-box">
      <div class="label">Рекорд</div>
      <div id="best" class="value">0</div>
    </div>
    <div id="levelBox" class="stat-box">
      <div class="label">Рівень</div>
      <div id="levelDisplay" class="value">1</div>
    </div>
    <button style="background:#333; border:1px solid #444; color:white; border-radius:50%; width:40px; height:40px; cursor:pointer;" onclick="toggleMusic()">🔈</button>
  </div>

  <canvas id="tetris" width="240" height="400"></canvas>
  <button id="reviveBtn" onclick="revivePlayer()">♻️ Відродитись (500 очок)</button>

  <div class="controls">
    <div></div>
    <div class="btn" style="background:#444" onpointerdown="playerRotate(1)">🔄</div>
    <div></div>
    <div class="btn" onpointerdown="playerMove(-1)">⬅️</div>
    <div class="btn" onpointerdown="playerDrop()">⬇️</div>
    <div class="btn" onpointerdown="playerMove(1)">➡️</div>
  </div>

  <div id="leaderboard-ui">
    <h2 style="color: #ffd700; margin: 0; font-size: 32px;">КІНЕЦЬ ГРИ 🗿</h2>
    <p style="margin: 10px 0; font-size: 18px;">Ваш результат: <span id="finalScore" style="font-size: 32px; color: #00d4ff;">0</span></p>
    <input type="text" id="playerName" maxlength="15" placeholder="Твій нік">
    <button class="share-btn" onclick="shareResult()">🚀 Поділитися рекордом</button>
    <button onclick="closeLeaderboard()" style="margin-top: 25px; background: none; color: #888; border: none; text-decoration: underline; cursor: pointer;">Спробувати знову</button>
  </div>

  <audio id="bgMusic" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" type="audio/mpeg">
  </audio>

  <script>
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: 'https://providnykzpoun-bit.github.io/Tetris/tonconnect-manifest.json',
        buttonRootId: 'ton-connect-button'
    });

    let isLevelPaid = localStorage.getItem('ua_tetris_paid') === 'true';
    let dropInterval = isLevelPaid ? 450 : 1000;
    let gameId = null;
    
    document.getElementById('playerName').value = localStorage.getItem('ua_player_name') || "";

    function updateUI() {
        const display = document.getElementById('levelDisplay');
        const box = document.getElementById('levelBox');
        if(isLevelPaid) {
            display.innerText = "VIP";
            display.classList.add('vip-text');
            box.classList.add('vip-border');
            dropInterval = 450;
        } else {
            display.innerText = "1";
        }
    }
    updateUI();

    tonConnectUI.onStatusChange(wallet => {
        document.getElementById('payButton').style.display = (wallet && !isLevelPaid) ? 'block' : 'none';
    });

    async function sendPayment() {
        const transaction = {
            validUntil: Math.floor(Date.now() / 1000) + 120,
            messages: [{ address: "UQDXq1iAqu88tVRG62_k03kAXELu_1gzRBMye-VZoFRIRtWw", amount: "10000000" }]
        };
        try {
            await tonConnectUI.sendTransaction(transaction);
            localStorage.setItem('ua_tetris_paid', 'true');
            isLevelPaid = true;
            updateUI();
            document.getElementById('payButton').style.display = 'none';
            alert("VIP активовано! Швидкість та бонуси збільшено.");
        } catch (e) { console.error(e); }
    }

    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    context.scale(20, 20);

    function arenaSweep() {
        let rowCount = 1;
        outer: for (let y = arena.length - 1; y > 0; --y) {
            for (let x = 0; x < arena[y].length; ++x) {
                if (arena[y][x] === 0) continue outer;
            }
            const row = arena.splice(y, 1)[0].fill(0);
            arena.unshift(row);
            ++y;
            player.score += rowCount * (isLevelPaid ? 50 : 10);
            rowCount *= 2;
        }
    }

    function revivePlayer() {
        if (player.score >= 500) {
            player.score -= 500;
            arena.forEach((row, y) => { if(y < 10) row.fill(0) });
            document.getElementById('reviveBtn').style.display = 'none';
            updateScore();
            if(!gameId) update();
        }
    }

    function playerReset() {
        const pieces = 'ILJOTSZ';
        player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
        player.pos.y = 0;
        player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
        
        if (collide(arena, player)) {
            if (player.score >= 500) {
                document.getElementById('reviveBtn').style.display = 'block';
                cancelAnimationFrame(gameId);
                gameId = null;
            } else {
                finishGame();
            }
        }
    }

    function finishGame() {
        const finalScore = player.score;
        const best = localStorage.getItem('ua_tetris_best') || 0;
        if (finalScore > best) localStorage.setItem('ua_tetris_best', finalScore);
        
        document.getElementById('finalScore').innerText = finalScore;
        document.getElementById('leaderboard-ui').style.display = 'flex';
        cancelAnimationFrame(gameId);
        gameId = null;
    }

    function shareResult() {
        const name = document.getElementById('playerName').value || "Гравець";
        localStorage.setItem('ua_player_name', name);
        const score = player.score;
        const status = isLevelPaid ? "VIP 👑" : "Звичайний";
        const message = `🗿 Мій рекорд у UA TETRIS!\n\n👤 Нік: ${name}\n🏆 Очки: ${score}\n💎 Статус: ${status}\n\nГрай тут: @uatokenkrypta 🚀`;
        window.open(`https://t.me/share/url?url=https://t.me/uatokenkrypta&text=${encodeURIComponent(message)}`, '_blank');
    }

    function closeLeaderboard() {
        document.getElementById('leaderboard-ui').style.display = 'none';
        document.getElementById('reviveBtn').style.display = 'none';
        arena.forEach(row => row.fill(0));
        player.score = 0;
        updateScore();
        playerReset();
        if(!gameId) update();
    }

    const colors = [null, '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'];
    function createPiece(t) {
        if(t==='T')return[[0,1,0],[1,1,1],[0,0,0]]; if(t==='O')return[[2,2],[2,2]];
        if(t==='L')return[[0,3,0],[0,3,0],[0,3,3]]; if(t==='J')return[[0,4,0],[0,4,0],[4,4,0]];
        if(t==='I')return[[0,5,0,0],[0,5,0,0],[0,5,0,0],[0,5,0,0]];
        if(t==='S')return[[0,6,6],[6,6,0],[0,0,0]]; if(t==='Z')return[[7,7,0],[0,7,7],[0,0,0]];
    }
    function draw() { 
        context.fillStyle='#000'; 
        context.fillRect(0,0,canvas.width,canvas.height); 
        drawMatrix(arena,{x:0,y:0}); 
        drawMatrix(player.matrix,player.pos); 
    }
    function drawMatrix(m,o) { m.forEach((r,y)=>{ r.forEach((v,x)=>{ if(v!==0){ context.fillStyle=colors[v]; context.shadowBlur = 5; context.shadowColor = colors[v]; context.fillRect(x+o.x,y+o.y,1,1); context.shadowBlur = 0; }});});}
    function collide(a,p) { const [m,o]=[p.matrix,p.pos]; for(let y=0;y<m.length;++y){for(let x=0;x<m[y].length;++x){if(m[y][x]!==0&&(a[y+o.y]&&a[y+o.y][x+o.x])!==0)return true;}} return false; }
    function merge(a,p) { p.matrix.forEach((r,y)=>{r.forEach((v,x)=>{if(v!==0)a[y+p.pos.y][x+p.pos.x]=v;});});}
    function rotate(m,d) { for(let y=0;y<m.length;++y){for(let x=0;x<y;++x){[m[x][y],m[y][x]]=[m[y][x],m[x][y]];}} if(d>0)m.forEach(r=>r.reverse()); else m.reverse(); }
    function playerDrop() { player.pos.y++; if(collide(arena,player)){player.pos.y--; merge(arena,player); playerReset(); arenaSweep(); updateScore();} dropCounter=0; }
    function playerMove(d) { player.pos.x+=d; if(collide(arena,player))player.pos.x-=d; }
    function playerRotate(d) { const p=player.pos.x; let o=1; rotate(player.matrix,d); while(collide(arena,player)){player.pos.x+=o; o=-(o+(o>0?1:-1)); if(o>player.matrix[0].length){rotate(player.matrix,-d); player.pos.x=p; return;}}}
    function updateScore() { document.getElementById('score').innerText=player.score; const b=localStorage.getItem('ua_tetris_best')||0; document.getElementById('best').innerText=player.score>b?player.score:b; }
    
    let dropCounter=0, lastTime=0;
    function update(t = 0){ 
        const dt = t - lastTime; 
        lastTime = t; 
        dropCounter += dt; 
        if(dropCounter > dropInterval) playerDrop(); 
        draw(); 
        gameId = requestAnimationFrame(update); 
    }
    
    const arena=createMatrix(12,20), player={pos:{x:0,y:0},matrix:null,score:0};
    function createMatrix(w, h) { const m = []; while (h--) m.push(new Array(w).fill(0)); return m; }
    
    const music=document.getElementById('bgMusic'); let isM=false;
    function toggleMusic(){ 
        if(isM){ music.pause(); document.querySelector('button[onclick="toggleMusic()"]').innerText='🔈'; } 
        else { music.play().catch(e=>{}); document.querySelector('button[onclick="toggleMusic()"]').innerText='🔊'; } 
        isM=!isM; 
    }
    
    playerReset(); 
    updateScore(); 
    update();
  </script>
</body>
</html>
