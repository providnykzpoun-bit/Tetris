<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UA TETRIS 🗿</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body { background: #111; color: white; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; margin: 0; padding: 5px; touch-action: none; overflow: hidden; height: 100vh; }
        #ton-connect-button { margin-bottom: 5px; min-height: 44px; display: flex; justify-content: center; width: 100%; }
        
        .top-link-btn { 
            width: 280px; background: #ffd700; color: #000; padding: 10px; border-radius: 8px; 
            text-decoration: none; font-weight: bold; font-size: 13px; margin-bottom: 8px; text-align: center; display: block;
        }

        /* Рядок з двома окремими елементами */
        .info-row { 
            display: flex; 
            gap: 8px; 
            width: 280px; 
            margin-bottom: 8px; 
        }

        .info-item { 
            flex: 1; 
            background: #1a1a1a; 
            border: 1px solid #ffd700; 
            border-radius: 8px; 
            padding: 6px 4px;
            text-align: center;
        }

        .info-label { font-size: 8px; color: #ffd700; text-transform: uppercase; margin-bottom: 2px; display: block; }
        .info-value { font-size: 13px; font-weight: bold; color: #ffd700; }

        .stats-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .stat-box { background: #222; padding: 5px; border-radius: 6px; border: 1px solid #333; min-width: 80px; text-align: center; }
        .stat-label { font-size: 8px; color: #aaa; text-transform: uppercase; }
        .stat-value { font-size: 16px; font-weight: bold; color: #00d4ff; }

        canvas { border: 2px solid #333; background: #000; width: 220px; height: 380px; border-radius: 8px; }
        
        .controls { display: flex; gap: 8px; margin-top: 10px; width: 100%; justify-content: center; }
        .btn { background: #333; border: 1px solid #444; color: white; width: 55px; height: 55px; border-radius: 12px; font-size: 20px; display: flex; align-items: center; justify-content: center; user-select: none; }

        .overlay { display:none; background: rgba(0,0,0,0.9); position: fixed; top:0; left:0; width:100%; height:100%; z-index:1000; flex-direction: column; align-items: center; justify-content: center; }
        .content { background: #1a1a1a; padding: 20px; border-radius: 20px; width: 80%; text-align: center; border: 2px solid #ffd700; }
    </style>
</head>
<body>

    <div id="ton-connect-button"></div>
    
    <a href="URL_ВАШОЇ_ГРИ" class="top-link-btn">🎮 ПОГРАТИ В ІНШУ ГРУ</a>

    <div class="info-row">
        <div class="info-item">
            <span class="info-label">Доступно до виплати</span>
            <div class="info-value">5000 UA</div>
        </div>
        <div class="info-item">
            <span class="info-label">Отримано</span>
            <div id="balance-ua" class="info-value">0.00 TON</div>
        </div>
    </div>

    <div class="stats-row">
        <div class="stat-box"><div class="stat-label">Очки</div><div id="score" class="stat-value">0</div></div>
        <div class="stat-box"><div class="stat-label">Рівень</div><div id="level" class="stat-value">1</div></div>
    </div>

    <canvas id="tetris" width="240" height="400"></canvas>

    <div class="controls">
        <div class="btn" onpointerdown="playerMove(-1)">⬅️</div>
        <div class="btn" onpointerdown="playerRotate()">🔄</div>
        <div class="btn" onpointerdown="playerDrop()">⬇️</div>
        <div class="btn" onpointerdown="playerMove(1)">➡️</div>
    </div>

    <div id="unlockBox" class="overlay">
        <div class="content">
            <h2 style="color:#ffd700">ТУР 1 ПРОЙДЕНО!</h2>
            <p>Розблокуйте наступний тур, щоб вивести 5000 UA на 400 очках!</p>
            <button class="top-link-btn" style="border:none; cursor:pointer;" onclick="payAndContinue()">🔓 РОЗБЛОКУВАТИ (0.01 TON)</button>
        </div>
    </div>

    <script>
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://providnykzpoun-bit.github.io/Tetris/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        async function updateBalance() {
            const wallet = tonConnectUI.account;
            if (wallet) {
                try {
                    const res = await fetch(`https://toncenter.com/api/v2/getAddressInformation?address=${wallet.address}`);
                    const data = await res.json();
                    if (data.ok) {
                        const bal = (data.result.balance / 1e9).toFixed(2);
                        document.getElementById('balance-ua').innerText = bal + " TON";
                    }
                } catch (e) { console.error(e); }
            }
        }
        setInterval(updateBalance, 5000);

        let isVip = false;
        let isPaused = false;
        let dropInterval = 1000;
        let dropCounter = 0;
        let lastTime = 0;

        function payAndContinue() {
            isVip = true;
            isPaused = false;
            document.getElementById('unlockBox').style.display = 'none';
            requestAnimationFrame(update); 
        }

        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        context.scale(20, 20);

        function createPiece(type) {
            if (type === 'I') return [[0,1,0,0],[0,1,0,0],[0,1,0,0],[0,1,0,0]];
            if (type === 'L') return [[0,2,0],[0,2,0],[0,2,2]];
            if (type === 'J') return [[0,3,0],[0,3,0],[3,3,0]];
            if (type === 'O') return [[4,4],[4,4]];
            if (type === 'Z') return [[5,5,0],[0,5,5],[0,0,0]];
            if (type === 'S') return [[0,6,6],[6,6,0],[0,0,0]];
            if (type === 'T') return [[0,7,0],[7,7,7],[0,0,0]];
        }

        const colors = [null, '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'];
        const arena = Array.from({length: 20}, () => new Array(12).fill(0));
        const player = { pos: {x: 0, y: 0}, matrix: null, score: 0 };

        function updateScore() {
            document.getElementById('score').innerText = player.score;
            const level = Math.floor(player.score / 200) + 1;
            document.getElementById('level').innerText = level;
            dropInterval = Math.max(100, 1000 - (level - 1) * 250);

            if (player.score >= 200 && !isVip) {
                isPaused = true;
                document.getElementById('unlockBox').style.display = 'flex';
            }
        }

        function draw() {
            context.fillStyle = '#000';
            context.fillRect(0, 0, canvas.width, canvas.height);
            drawMatrix(arena, {x: 0, y: 0});
            drawMatrix(player.matrix, player.pos);
        }

        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.fillStyle = colors[value];
                        context.fillRect(x + offset.x, y + offset.y, 1, 1);
                    }
                });
            });
        }

        function collide(arena, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) return true;
                }
            }
            return false;
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value;
                });
            });
        }

        function playerReset() {
            const pieces = 'ILJOTSZ';
            player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
            if (collide(arena, player)) {
                arena.forEach(row => row.fill(0));
                player.score = 0;
                updateScore();
            }
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
            }
            dropCounter = 0;
        }

        function arenaSweep() {
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) continue outer;
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;
                player.score += 10;
            }
            updateScore();
        }

        function playerMove(dir) {
            if (isPaused) return;
            player.pos.x += dir;
            if (collide(arena, player)) player.pos.x -= dir;
        }

        function playerRotate() {
            if (isPaused) return;
            const pos = player.pos.x;
            let offset = 1;
            const matrix = player.matrix;
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            matrix.forEach(row => row.reverse());
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > matrix[0].length) {
                    player.pos.x = pos;
                    return;
                }
            }
        }

        function update(time = 0) {
            if (isPaused) return;
            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;
            if (dropCounter > dropInterval) playerDrop();
            draw();
            requestAnimationFrame(update);
        }

        playerReset();
        update();
    </script>
</body>
</html>
