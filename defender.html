<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UA DEFENDER 🛡️</title>
    <style>
        body { background: #0a0a0a; color: white; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; margin: 0; overflow: hidden; height: 100vh; }
        canvas { background: #000; border: 2px solid #ffd700; border-radius: 10px; margin-top: 10px; width: 90vw; height: 60vh; touch-action: none; }
        .ui { text-align: center; margin-top: 10px; }
        .score { font-size: 24px; color: #ffd700; font-weight: bold; }
        .controls { display: flex; gap: 20px; margin-top: 20px; }
        .btn { background: #333; border: 2px solid #ffd700; color: white; width: 80px; height: 80px; border-radius: 50%; font-size: 30px; display: flex; align-items: center; justify-content: center; user-select: none; touch-action: manipulation; }
        .back-btn { margin-top: 15px; padding: 10px 20px; background: #ffd700; color: #000; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <div class="ui">
        <div class="score">ЗБИТО ЛІТАКІВ: <span id="val">0</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="controls">
        <div class="btn" id="leftBtn">⬅️</div>
        <div class="btn" id="rightBtn">➡️</div>
    </div>

    <a href="index.html" class="back-btn">🔙 ПОВЕРНУТИСЬ ДО ТЕТРІСУ</a>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreVal = document.getElementById('val');

        canvas.width = 400;
        canvas.height = 600;

        let score = 0;
        let player = { x: 175, y: 540, w: 50, h: 25, speed: 7 };
        let projectiles = [];
        let enemies = [];
        let explosions = [];
        let moveLeft = false;
        let moveRight = false;

        function spawnEnemy() {
            enemies.push({
                x: Math.random() * (canvas.width - 40),
                y: -40,
                w: 40,
                h: 30,
                speed: 2 + Math.random() * 2.5
            });
        }

        function shoot() {
            // Кулеметна черга (дві кулі зліва і справа від ствола)
            projectiles.push({ x: player.x + 10, y: player.y, w: 3, h: 12, speed: 10 });
            projectiles.push({ x: player.x + player.w - 13, y: player.y, w: 3, h: 12, speed: 10 });
        }

        setInterval(spawnEnemy, 900);
        setInterval(shoot, 180); // Швидка стрільба кулемета

        function update() {
            if (moveLeft && player.x > 0) player.x -= player.speed;
            if (moveRight && player.x < canvas.width - player.w) player.x += player.speed;

            // Снаряди
            projectiles.forEach(p => { p.y -= p.speed; });
            projectiles = projectiles.filter(p => p.y > 0);

            // Вороги (літаки)
            enemies.forEach(e => { e.y += e.speed; });

            // Вибухи
            explosions.forEach(ex => { ex.r += 2; ex.alpha -= 0.05; });
            explosions = explosions.filter(ex => ex.alpha > 0);

            // Колізії (влучання кулемета в літаки)
            let activeProjectiles = [];
            projectiles.forEach(p => {
                let hit = false;
                enemies.forEach(e => {
                    if (!hit && p.x < e.x + e.w && p.x + p.w > e.x && p.y < e.y + e.h && p.y + p.h > e.y) {
                        hit = true;
                        e.dead = true;
                        score += 1;
                        scoreVal.innerText = score;
                        // Додаємо ефект вибуху
                        explosions.push({ x: e.x + e.w/2, y: e.y + e.h/2, r: 5, alpha: 1 });
                    }
                });
                if (!hit) activeProjectiles.push(p);
            });
            projectiles = activeProjectiles;

            // Штраф за пропущений літак
            enemies.forEach(e => {
                if (e.y > canvas.height && !e.dead) {
                    if (score > 0) score -= 1;
                    scoreVal.innerText = score;
                }
            });
            enemies = enemies.filter(e => e.y <= canvas.height && !e.dead);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // ПВО / База гравця (ЗРК / Кулеметна установка)
            ctx.fillStyle = '#ffd700';
            ctx.fillRect(player.x, player.y + 10, player.w, player.h - 10);
            ctx.fillRect(player.x + player.w/2 - 4, player.y, 8, 12); // Ствол кулемета

            // Кулі кулемета
            ctx.fillStyle = '#00ffff';
            projectiles.forEach(p => {
                ctx.fillRect(p.x, p.y, p.w, p.h);
            });

            // Ворожі літаки / дрони
            enemies.forEach(e => {
                ctx.fillStyle = '#ff3333';
                // Корпус літака
                ctx.fillRect(e.x + 12, e.y + 5, 16, 20);
                // Крила
                ctx.fillStyle = '#ff6666';
                ctx.fillRect(e.x, e.y + 12, e.w, 6);
                // Кабіна / ніс
                ctx.fillStyle = '#ffff33';
                ctx.fillRect(e.x + 16, e.y, 8, 8);
            });

            // Малювання вибухів
            explosions.forEach(ex => {
                ctx.save();
                ctx.globalAlpha = ex.alpha;
                ctx.strokeStyle = '#ffcc00';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(ex.x, ex.y, ex.r, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            });
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Керування
        const lBtn = document.getElementById('leftBtn');
        const rBtn = document.getElementById('rightBtn');

        ['pointerdown', 'touchstart'].forEach(evt => {
            lBtn.addEventListener(evt, (e) => { e.preventDefault(); moveLeft = true; });
            rBtn.addEventListener(evt, (e) => { e.preventDefault(); moveRight = true; });
        });

        ['pointerup', 'pointercancel', 'pointerleave', 'touchend'].forEach(evt => {
            window.addEventListener(evt, () => { moveLeft = false; moveRight = false; });
        });

        loop();
    </script>
</body>
</html>
