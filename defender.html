<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UA DEFENDER 🛡️</title>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body { background: #0a0a0a; color: white; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; margin: 0; overflow: hidden; height: 100vh; }
        #ton-connect-button { margin-top: 5px; margin-bottom: 5px; min-height: 35px; width: 100%; display: flex; justify-content: center; z-index: 100; }
        canvas { background: #000; border: 2px solid #ffd700; border-radius: 10px; width: 90vw; height: 50vh; touch-action: none; }
        .ui { display: flex; justify-content: space-around; width: 90vw; margin: 5px 0; font-size: 16px; color: #ffd700; font-weight: bold; }
        .controls { display: flex; gap: 20px; margin-top: 10px; }
        .btn { background: #333; border: 2px solid #ffd700; color: white; width: 70px; height: 70px; border-radius: 50%; font-size: 25px; display: flex; align-items: center; justify-content: center; user-select: none; touch-action: manipulation; }
        .back-btn { margin-top: 10px; padding: 8px 15px; background: #333; color: #ffd700; border: 1px solid #ffd700; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 12px; }
        
        .overlay { display: none; background: rgba(0,0,0,0.85); position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; box-sizing: border-box; }
        .content { background: #1a1a1a; padding: 20px; border-radius: 20px; border: 2px solid #ffd700; max-width: 280px; }
        .action-btn { width: 100%; background: #ffd700; color: #000; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 13px; margin-top: 10px; border: none; cursor: pointer; display: block; box-sizing: border-box; }
        .withdraw-btn { background: #28a745; color: white; display: none; margin-top: 6px; }
    </style>
</head>
<body>

    <div id="ton-connect-button"></div>

    <div class="ui">
        <div>БАЛАНС: <span id="val">0</span> UA</div>
        <div>ПРОПУЩЕНО: <span id="missed">0</span>/10</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <button id="withdrawBtn" class="action-btn withdraw-btn" onclick="withdrawUA()">💰 ВИВЕСТИ 500 UA</button>

    <div class="controls">
        <div class="btn" id="leftBtn">⬅️</div>
        <div class="btn" id="rightBtn">➡️</div>
    </div>

    <a href="index.html" class="back-btn">🔙 ПОВЕРНУТИСЬ ДО ТЕТРІСУ</a>

    <!-- Екран при досягненні ліміту пропущених -->
    <div id="gameOverBox" class="overlay">
        <div class="content">
            <h2 style="color:#ff4444; margin-top:0;">ГРУ ЗАВЕРШЕНО</h2>
            <p style="font-size: 13px;">Забагато пропущених цілей! Бажаєте продовжити або почати заново?</p>
            <button class="action-btn" onclick="restartGame()">🔄 ГРАТИ ЗНОВУ (БЕЗКОШТОВНО)</button>
            <button class="action-btn" style="background:#333; color:#ffd700; border:1px solid #ffd700;" onclick="buyContinue()">🛡️ ПРОДОВЖИТИ ЗА 0.01 TON</button>
        </div>
    </div>

    <script>
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://providnykzpoun-bit.github.io/Tetris/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreVal = document.getElementById('val');
        const missedVal = document.getElementById('missed');
        const withdrawBtn = document.getElementById('withdrawBtn');
        const gameOverBox = document.getElementById('gameOverBox');

        canvas.width = 400;
        canvas.height = 500;

        let score = 0;
        let missedCount = 0;
        const maxMissed = 10; // Даємо аж 10 спроб, щоб грати було комфортно
        let isGameOver = false;
        let player = { x: 175, y: 440, w: 50, h: 25, speed: 7 };
        let projectiles = [];
        let enemies = [];
        let explosions = [];
        let moveLeft = false;
        let moveRight = false;

        function spawnEnemy() {
            if (isGameOver) return;
            enemies.push({
                x: Math.random() * (canvas.width - 40),
                y: -40,
                w: 40,
                h: 30,
                speed: 1.5 + Math.random() * 1.5 // Повільніші літаки, щоб легко встигати
            });
        }

        function shoot() {
            if (isGameOver) return;
            projectiles.push({ x: player.x + 10, y: player.y, w: 3, h: 12, speed: 10 });
            projectiles.push({ x: player.x + player.w - 13, y: player.y, w: 3, h: 12, speed: 10 });
        }

        setInterval(spawnEnemy, 1500); // Літаки летять рідше (раз на 1.5 сек)
        setInterval(shoot, 200);

        function update() {
            if (isGameOver) return;

            if (moveLeft && player.x > 0) player.x -= player.speed;
            if (moveRight && player.x < canvas.width - player.w) player.x += player.speed;

            projectiles.forEach(p => { p.y -= p.speed; });
            projectiles = projectiles.filter(p => p.y > 0);

            enemies.forEach(e => { e.y += e.speed; });

            explosions.forEach(ex => { ex.r += 2; ex.alpha -= 0.05; });
            explosions = explosions.filter(ex => ex.alpha > 0);

            // Колізії кулі з літаком
            let activeProjectiles = [];
            projectiles.forEach(p => {
                let hit = false;
                enemies.forEach(e => {
                    if (!hit && p.x < e.x + e.w && p.x + p.w > e.x && p.y < e.y + e.h && p.y + p.h > e.y) {
                        hit = true;
                        e.dead = true;
                        score += 1;
                        scoreVal.innerText = score;
                        explosions.push({ x: e.x + e.w/2, y: e.y + e.h/2, r: 5, alpha: 1 });

                        if (score >= 500) {
                            withdrawBtn.style.display = 'block';
                        }
                    }
                });
                if (!hit) activeProjectiles.push(p);
            });
            projectiles = activeProjectiles;

            // Пропущені літаки
            enemies.forEach(e => {
                if (e.y > canvas.height && !e.dead) {
                    e.dead = true;
                    missedCount++;
                    missedVal.innerText = missedCount;
                    if (missedCount >= maxMissed) {
                        isGameOver = true;
                        gameOverBox.style.display = 'flex';
                    }
                }
            });
            enemies = enemies.filter(e => e.y <= canvas.height && !e.dead);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // База / ППО
            ctx.fillStyle = '#ffd700';
            ctx.fillRect(player.x, player.y + 10, player.w, player.h - 10);
            ctx.fillRect(player.x + player.w/2 - 4, player.y, 8, 12);

            // Кулі
            ctx.fillStyle = '#00ffff';
            projectiles.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));

            // Літаки
            enemies.forEach(e => {
                ctx.fillStyle = '#ff3333';
                ctx.fillRect(e.x + 12, e.y + 5, 16, 20);
                ctx.fillStyle = '#ff6666';
                ctx.fillRect(e.x, e.y + 12, e.w, 6);
                ctx.fillStyle = '#ffff33';
                ctx.fillRect(e.x + 16, e.y, 8, 8);
            });

            // Вибухи
            explosions.forEach(ex => {
                ctx.save();
                ctx.globalAlpha = ex.alpha;
                ctx.strokeStyle = '#ffcc00';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(ex.x, ex.y, ex.r, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            });
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function restartGame() {
            score = 0;
            missedCount = 0;
            scoreVal.innerText = score;
            missedVal.innerText = missedCount;
            enemies = [];
            projectiles = [];
 сповільнення = false;
            isGameOver = false;
            gameOverBox.style.display = 'none';
            withdrawBtn.style.display = 'none';
        }

        async function buyContinue() {
            if (!tonConnectUI.connected) {
                alert('Підключіть гаманець зверху!');
                return;
            }

            const transaction = {
                validUntil: Math.floor(Date.now() / 1000) + 300,
                messages: [{
                    address: "UQDXq1iAqu88tVRG62_k03kAXELu_1gzRBMye-VZoFRIRtWw",
                    amount: "10000000" // 0.01 TON
                }]
            };

            try {
                await tonConnectUI.sendTransaction(transaction);
                missedCount = 0;
                missedVal.innerText = missedCount;
                isGameOver = false;
                gameOverBox.style.display = 'none';
            } catch (e) {
                console.log("Скасовано", e);
            }
        }

        function withdrawUA() {
            const wallet = tonConnectUI.account ? tonConnectUI.account.address : "Не підключено";
            const text = `ЗАЯВКА НА ВИПЛАТУ:%0A🛡️ Гра: UA DEFENDER%0A💰 Сума: ${score} UA%0A👛 Гаманець: ${wallet}`;
            window.open(`https://t.me/tokenpist_bot?text=${text}`, '_blank');
            score = 0;
            scoreVal.innerText = score;
            withdrawBtn.style.display = 'none';
        }

        // Керування
        const lBtn = document.getElementById('leftBtn');
        const rBtn = document.getElementById('rightBtn');

        ['pointerdown', 'touchstart'].forEach(evt => {
            lBtn.addEventListener(evt, (e) => { e.preventDefault(); moveLeft = true; });
            rBtn.addEventListener(evt, (e) => { e.preventDefault(); moveRight = true; });
        });

        ['pointerup', 'pointercancel', 'pointerleave', 'touchend'].forEach(evt => {
            window.addEventListener(evt, () => { moveLeft = false; moveRight = false; });
        });

        loop();
    </script>
</body>
</html>
